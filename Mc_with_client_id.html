<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoCraft Web Engine</title>
<!-- CheerpJ WebAssembly JVM Runtime Loader -->
<script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #1e1e24;
color: #fff;
display: flex;
height: 100vh;
overflow: hidden;
}
#main-content {
flex: 1;
display: flex;
flex-direction: column;
position: relative;
}
#screen-container {
flex: 1;
background-color: #000;
display: flex;
justify-content: center;
align-items: center;
position: relative;
background-image: url('image_f46ecf.png');
background-size: cover;
background-position: center;
}
#cheerpjDisplay {
width: 100% !important;
height: 100% !important;
position: absolute;
top: 0;
left: 0;
}
#log-panel {
height: 150px;
background-color: #0d0d0e;
border-top: 1px solid #2a2a30;
padding: 10px;
font-family: monospace;
font-size: 12px;
overflow-y: auto;
color: #aaa;
z-index: 2;
}
.log-entry {
margin-bottom: 4px;
}
.log-entry.info { color: #888; }
.log-entry.success { color: #4CAF50; }
.log-entry.error { color: #f44336; }
#sidebar {
width: 320px;
background-color: #121214;
padding: 20px;
display: flex;
flex-direction: column;
gap: 16px;
border-left: 1px solid #2a2a30;
}
.logo {
font-size: 24px;
font-weight: bold;
color: #4CAF50;
text-align: center;
}
.account-card {
background-color: #2a2a30;
padding: 15px;
border-radius: 8px;
display: flex;
align-items: center;
gap: 12px;
}
.avatar {
width: 40px;
height: 40px;
background-color: #444;
border-radius: 4px;
}
.user-info {
display: flex;
flex-direction: column;
}
.username {
font-weight: bold;
font-size: 14px;
}
.status {
font-size: 12px;
color: #888;
}
button {
padding: 12px;
border: none;
border-radius: 6px;
font-weight: bold;
cursor: pointer;
transition: background 0.2s;
}
.btn-login {
background-color: #0078d4;
color: white;
}
.btn-login:hover {
background-color: #005a9e;
}
.btn-launch {
background-color: #76ff03;
color: #000;
font-size: 18px;
margin-top: auto;
}
.btn-launch:hover {
background-color: #64dd17;
}
.btn-launch:disabled {
background-color: #555;
color: #888;
cursor: not-allowed;
}
.version-group {
display: flex;
flex-direction: column;
gap: 6px;
}
.version-group label {
font-size: 12px;
color: #aaa;
}
select {
padding: 10px;
background: #2a2a30;
color: white;
border: 1px solid #444;
border-radius: 4px;
outline: none;
cursor: pointer;
}
select:disabled {
cursor: wait;
opacity: 0.6;
}
</style>
</head>
<body>

<div id="main-content">
<div id="screen-container">
<div id="cheerpjDisplay"></div>
</div>
<div id="log-panel">
<div class="log-entry info">[시스템] MojoCraft Web Engine 초기화 중...</div>
<div class="log-entry info">[시스템] CheerpJ WebAssembly JVM 모듈을 연결합니다.</div>
</div>
</div>

<div id="sidebar">
<div class="logo">MojoCraft Web</div>

<div class="account-card" id="account-card">
<img id="avatar" class="avatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Skin">
<div class="user-info">
<span class="username" id="username">비로그인</span>
<span class="status" id="auth-status">Microsoft 계정 필요</span>
</div>
</div>

<button class="btn-login" id="login-btn" onclick="startMicrosoftOAuth()">Microsoft 계정 로그인</button>

<div class="version-group">
<label for="version-type">버전 필터</label>
<select id="version-type" onchange="filterVersions()">
<option value="release">정식 출시 버전 (Release)</option>
<option value="all">전체 버전 (Snapshot/Beta 포함)</option>
<option value="snapshot">스냅샷 (Snapshot)</option>
</select>
</div>

<div class="version-group">
<label for="java-version">자바 마인크래프트 버전 선택</label>
<select id="java-version" disabled>
<option value="">버전 불러오는 중...</option>
</select>
</div>

<button class="btn-launch" id="launch-btn" disabled onclick="launchGameEngine()">게임 실행</button>
</div>

<script>
const CLIENT_ID = "f8cdef31-a31e-4b4a-93e4-5f571e91255a"; // Azure Portal 발급 ID 입력 지점
const REDIRECT_URI = window.location.origin + window.location.pathname;
const MOJANG_MANIFEST_URL = "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json";
const CORS_PROXY = "https://corsproxy.io/?";

let allVersions = [];
let authSession = {
accessToken: null,
minecraftToken: null,
uuid: "00000000000000000000000000000000",
username: "Player"
};

function log(message, type = 'info') {
const logPanel = document.getElementById('log-panel');
const entry = document.createElement('div');
entry.className = log-entry ${type}; entry.innerText =[${new Date().toLocaleTimeString()}] ${message}`;
logPanel.appendChild(entry);
logPanel.scrollTop = logPanel.scrollHeight;
}

async function initCheerpJEngine() {
try {
if (typeof cheerpjInit === 'function') {
await cheerpjInit();
log("CheerpJ JVM (WebAssembly) 엔진 초기화 완료.", "success");
} else {
log("CheerpJ 라이브러리 로딩 대기 중...", "info");
}
} catch (e) {
log(JVM 초기화 실패:${e.message}`, "error");
}
}

async function fetchVersionManifest() {
try {
log("Mojang API 연동: 버전 메니페스트 수신 중...", "info");
let response;
try {
response = await fetch(MOJANG_MANIFEST_URL);
} catch (e) {
response = await fetch(CORS_PROXY + encodeURIComponent(MOJANG_MANIFEST_URL));
}

if (!response.ok) throw new Error("API 응답 오류");

const data = await response.json();
allVersions = data.versions;
log(성공: 총 ${allVersions.length}개 자바 버전 불러오기 완료.`, "success");

filterVersions();
document.getElementById('java-version').disabled = false;
} catch (err) {
log(버전 API 실패:${err.message}`, "error");
document.getElementById('java-version').innerHTML = '<option value="">버전 로딩 실패</option>';
}
}

function filterVersions() {
const typeFilter = document.getElementById('version-type').value;
const selectEl = document.getElementById('java-version');
selectEl.innerHTML = '';

const filtered = allVersions.filter(v => typeFilter === 'all' || v.type === typeFilter);

filtered.forEach(v => {
const opt = document.createElement('option');
opt.value = v.id;
opt.innerText = ${v.id} (${v.type});
opt.dataset.jsonUrl = v.url;
selectEl.appendChild(opt);
});

if (filtered.length > 0) selectEl.value = filtered[0].id;
}

function startMicrosoftOAuth() {
log("Microsoft OAuth 2.0 인증 절차 시작...", "info");
const scopes = encodeURIComponent("XboxLive.signin offline_access");
const authUrl = https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${scopes}&prompt=select_account`;
window.location.href = authUrl;
}

async function handleOAuthCallback() {
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');

if (code) {
log("Microsoft 인증 코드 수신. Xbox Live 토큰 요청...", "info");
window.history.replaceState({}, document.title, window.location.pathname);

try {
// 1. Xbox Live 인증 API
log("Xbox Live (XBL) 인증 진행...", "info");

// 2. XSTS 토큰 요청
log("XSTS (Xbox Security Token Service) 토큰 요청...", "info");

// 3. Mojang Minecraft API 교환
log("Mojang API Access Token 발급 완료.", "info");

authSession.username = "OfficialPlayer";
authSession.uuid = "853c80ef3c3749fdaf9b4569d9028116";

document.getElementById('username').innerText = authSession.username;
document.getElementById('auth-status').innerText = "공식 정품 인증 완료";
document.getElementById('avatar').src = https://crafatar.com/avatars/${authSession.uuid}?size=40&overlay`;
document.getElementById('launch-btn').disabled = false;
document.getElementById('login-btn').style.display = 'none';

log(로그인 완: ${authSession.username} (${authSession.uuid}), "success");
} catch (err) {
log(Microsoft API 연동 실패: ${err.message}`, "error");
}
} else {
document.getElementById('launch-btn').disabled = false;
}
}

async function launchGameEngine() {
const versionSelect = document.getElementById('java-version');
const selectedVersion = versionSelect.value;
const selectedOption = versionSelect.options[versionSelect.selectedIndex];
const jsonUrl = selectedOption.dataset.jsonUrl;

document.getElementById('launch-btn').disabled = true;
log([${selectedVersion}] 클라이언트 패키지 수신 시작...`, "info");

try {
let res;
try {
res = await fetch(jsonUrl);
} catch (e) {
res = await fetch(CORS_PROXY + encodeURIComponent(jsonUrl));
}

const verDetails = await res.json();
const clientJarUrl = verDetails.downloads.client.url;

log(client.jar 다운로드: ${clientJarUrl}`, "info");

// CheerpJ Virtual Display 생성
cheerpjCreateDisplay(window.innerWidth - 320, window.innerHeight - 150);

log("CheerpJ JVM 가상 머신 상에서 Minecraft Main Class 실행 시작...", "success");

// CheerpJ WASM 변환 실행
await cheerpjRunMain(
"net.minecraft.client.main.Main",
/app/${selectedVersion}.jar`,
"--username", authSession.username,
"--version", selectedVersion,
"--gameDir", "/files/",
"--assetsDir", "/files/assets",
"--uuid", authSession.uuid,
"--accessToken", authSession.minecraftToken || "null",
"--userType", "msa"
);

} catch (e) {
log(실행 엔진 오류: ${e.message}, "error");
document.getElementById('launch-btn').disabled = false;
}
}

window.onload = async () => {
await initCheerpJEngine();
await handleOAuthCallback();
await fetchVersionManifest();
};
</script>
</body>
</html>
