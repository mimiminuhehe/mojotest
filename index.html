<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MojoCraft Web</title>


    <style>

        /* =====================================================
           기본
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111;
            color: #fff;
        }


        body {
            display: flex;
        }


        /* =====================================================
           전체 앱
        ===================================================== */

        #app {
            width: 100%;
            height: 100vh;

            display: flex;

            background: #111;
        }


        /* =====================================================
           메인
        ===================================================== */

        #main {
            flex: 1;

            height: 100%;

            display: flex;
            flex-direction: column;

            min-width: 0;

            background: #111;
        }


        /* =====================================================
           사진 화면
        ===================================================== */

        #screen-container {
            position: relative;

            flex: 1;

            width: 100%;
            min-height: 0;

            overflow: hidden;

            background: #111;
        }


        #gameImage {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            opacity: 1;

            transition:
                opacity 0.45s ease;

            z-index: 1;
        }


        #gameImage.fade-out {
            opacity: 0;
        }


        /* =====================================================
           ★ 사진 인디케이터
        ===================================================== */

        #image-indicators {
            position: absolute;

            left: 0;
            right: 0;

            bottom: 22px;

            width: 100%;

            display: flex;

            flex-direction: row;

            align-items: center;
            justify-content: center;

            gap: 10px;

            z-index: 1000;

            pointer-events: auto;
        }


        .image-indicator {
            appearance: none;
            -webkit-appearance: none;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 16px;
            height: 16px;

            min-width: 16px;
            min-height: 16px;

            margin: 0;
            padding: 0;

            border: 2px solid rgba(255,255,255,0.95);

            border-radius: 50%;

            background: rgba(0,0,0,0.35);

            box-shadow:
                0 1px 5px rgba(0,0,0,0.7);

            cursor: pointer;

            pointer-events: auto;

            opacity: 1;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }


        /* 마우스를 올렸을 때 */

        .image-indicator:hover {
            transform: scale(1.25);

            background:
                rgba(255,255,255,0.75);

            box-shadow:
                0 2px 8px rgba(0,0,0,0.8);
        }


        /* 현재 사진 */

        .image-indicator.active {
            background: #fff;

            border-color: #fff;

            transform: scale(1.15);

            box-shadow:
                0 1px 7px rgba(0,0,0,0.8);
        }


        .image-indicator:focus {
            outline: 2px solid #fff;

            outline-offset: 3px;
        }


        /* =====================================================
           로딩
        ===================================================== */

        #loading {
            position: absolute;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background:
                rgba(0,0,0,0.65);

            z-index: 2000;
        }


        #loading.active {
            display: flex;
        }


        .loading-box {
            width: min(420px,85%);

            padding: 24px;

            background:
                rgba(20,20,20,0.96);

            border-radius: 12px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.5);
        }


        .loading-title {
            font-size: 18px;

            font-weight: bold;

            margin-bottom: 16px;
        }


        .progress-background {
            width: 100%;
            height: 8px;

            background: #333;

            border-radius: 10px;

            overflow: hidden;
        }


        .progress-bar {
            width: 0%;
            height: 100%;

            background: #4caf50;

            transition:
                width 0.2s ease;
        }


        #progress-text {
            margin-top: 10px;

            font-size: 13px;

            color: #aaa;

            text-align: right;
        }


        /* =====================================================
           로그
        ===================================================== */

        #log-panel {
            height: 120px;

            padding:
                10px 14px;

            background: #0c0c0c;

            border-top:
                1px solid #292929;

            overflow-y: auto;

            font-family: monospace;

            font-size: 12px;

            color: #aaa;
        }


        .log-line {
            margin-bottom: 4px;
        }


        .log-success {
            color: #75d175;
        }


        .log-error {
            color: #ff7373;
        }


        .log-info {
            color: #80bfff;
        }


        /* =====================================================
           오른쪽 사이드바
        ===================================================== */

        #sidebar {
            width: 320px;

            height: 100%;

            flex-shrink: 0;

            background: #181818;

            border-left:
                1px solid #303030;

            display: flex;

            flex-direction: column;

            overflow-y: auto;
        }


        /* =====================================================
           헤더
        ===================================================== */

        .sidebar-header {
            padding:
                22px 20px 16px;

            border-bottom:
                1px solid #303030;
        }


        .logo {
            font-size: 24px;

            font-weight: 800;

            color: #fff;

            letter-spacing: -1px;
        }


        .subtitle {
            margin-top: 5px;

            color: #888;

            font-size: 12px;
        }


        /* =====================================================
           계정
        ===================================================== */

        .account-section {
            padding: 16px;
        }


        .account-card {
            display: flex;

            align-items: center;

            padding: 12px;

            background: #222;

            border:
                1px solid #333;

            border-radius: 10px;

            margin-bottom: 10px;
        }


        .account-avatar {
            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #333;

            border-radius: 8px;

            font-size: 21px;

            margin-right: 10px;
        }


        .account-info {
            flex: 1;

            min-width: 0;
        }


        .account-name {
            font-size: 14px;

            font-weight: bold;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .account-status {
            margin-top: 4px;

            color: #777;

            font-size: 11px;
        }


        /* =====================================================
           버튼
        ===================================================== */

        button {
            font-family: inherit;
        }


        #login-button,
        #launch-button,
        .filter-button {
            cursor: pointer;
        }


        #login-button {
            width: 100%;

            padding: 12px;

            border:
                1px solid #444;

            border-radius: 8px;

            background: #2b2b2b;

            color: #fff;

            font-size: 14px;

            font-weight: bold;
        }


        #login-button:hover {
            filter: brightness(1.1);
        }


        #launch-button {
            width: 100%;

            padding: 14px;

            margin-top: 14px;

            border: 0;

            border-radius: 8px;

            background: #4caf50;

            color: #fff;

            font-size: 16px;

            font-weight: bold;
        }


        #launch-button:hover {
            filter: brightness(1.08);
        }


        #launch-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =====================================================
           버전
        ===================================================== */

        .version-section {
            padding:
                0 16px 16px;
        }


        .section-title {
            font-size: 12px;

            color: #888;

            margin-bottom: 8px;

            text-transform: uppercase;
        }


        .version-filter {
            display: flex;

            gap: 6px;

            margin-bottom: 10px;
        }


        .filter-button {
            flex: 1;

            padding:
                8px 4px;

            border:
                1px solid #333;

            border-radius: 8px;

            background: #242424;

            color: #aaa;

            font-size: 11px;

            font-weight: bold;
        }


        .filter-button:hover {
            filter: brightness(1.1);
        }


        .filter-button.active {
            background: #3b3b3b;

            color: #fff;

            border-color: #555;
        }


        #version-search {
            width: 100%;

            padding:
                10px 11px;

            border:
                1px solid #383838;

            border-radius: 7px;

            background: #222;

            color: #fff;

            outline: none;

            margin-bottom: 10px;
        }


        #version-search:focus {
            border-color: #555;
        }


        #version-list {
            max-height: 300px;

            overflow-y: auto;

            border:
                1px solid #2d2d2d;

            border-radius: 8px;

            background: #202020;
        }


        .version-item {
            padding:
                10px 11px;

            border-bottom:
                1px solid #2d2d2d;

            cursor: pointer;

            transition:
                background 0.15s;
        }


        .version-item:last-child {
            border-bottom: 0;
        }


        .version-item:hover {
            background: #2b2b2b;
        }


        .version-item.selected {
            background: #343434;

            box-shadow:
                inset 3px 0 0 #4caf50;
        }


        .version-name {
            font-size: 13px;

            font-weight: bold;
        }


        .version-type {
            margin-top: 3px;

            color: #777;

            font-size: 10px;
        }


        /* =====================================================
           실행 영역
        ===================================================== */

        .launch-section {
            padding:
                0 16px 20px;

            margin-top: auto;
        }


        #selected-version {
            margin-bottom: 7px;

            font-size: 12px;

            color: #888;

            text-align: center;
        }


        /* =====================================================
           모바일
        ===================================================== */

        @media (max-width: 800px) {

            #app {
                flex-direction: column;
            }


            #main {
                height: 55vh;

                flex: none;
            }


            #sidebar {
                width: 100%;

                height: 45vh;

                border-left: 0;

                border-top:
                    1px solid #303030;
            }


            #log-panel {
                height: 80px;
            }


            .sidebar-header {
                padding:
                    14px 16px 10px;
            }


            .account-section {
                padding:
                    10px 16px;
            }


            .version-section {
                padding-bottom: 10px;
            }


            .launch-section {
                padding-bottom: 14px;
            }


            #image-indicators {
                bottom: 16px;

                gap: 8px;
            }


            .image-indicator {
                width: 15px;
                height: 15px;

                min-width: 15px;
                min-height: 15px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         메인
    ===================================================== -->

    <main id="main">


        <section id="screen-container">


            <!-- Minecraft 사진 -->

            <img
                id="gameImage"
                src="./images/minecraft-bg.jpg"
                alt="Minecraft"
            >


            <!-- =================================================
                 ★ 사진 인디케이터
            ================================================= -->

            <div
                id="image-indicators"
            ></div>


            <!-- =================================================
                 로딩
            ================================================= -->

            <div id="loading">

                    <div class="loading-title">

                    </div>


                    <div

                    >

                        <div
                            id="progress-bar"

                        ></div>

                    </div>


                    <div

                    >

                    </div>

            </div>


        </section>


        <!-- 로그 -->

        <section

        ></section>


    </main>



    <!-- =====================================================
         오른쪽 사이드바
    ===================================================== -->

    <aside id="sidebar">


        <header
            class="sidebar-header"
        >

            <div class="logo">
                MojoCraft
            </div>


            <div class="subtitle">
                Web Minecraft Launcher
            </div>

        </header>



        <!-- =================================================
             계정
        ================================================= -->

        <section
            class="account-section"
        >


            <div
                class="account-card"
            >

                <div
                    class="account-avatar"
                >
                    ⛏️
                </div>


                <div
                    class="account-info"
                >

                    <div
                        id="account-name"
                        class="account-name"
                    >
                        로그인 필요
                    </div>


                    <div
                        id="account-status"
                        class="account-status"
                    >
                        Microsoft 계정
                    </div>

                </div>

            </div>


            <button
                id="login-button"
            >
                Microsoft 로그인
            </button>


        </section>



        <!-- =================================================
             Minecraft 버전
        ================================================= -->

        <section
            class="version-section"
        >


            <div
                class="section-title"
            >
                Minecraft 버전
            </div>


            <div
                class="version-filter"
            >

                <button
                    class="filter-button active"
                    data-filter="release"
                >
                    Release
                </button>


                <button
                    class="filter-button"
                    data-filter="snapshot"
                >
                    Snapshot
                </button>


                <button
                    class="filter-button"
                    data-filter="all"
                >
                    전체
                </button>

            </div>


            <input
                id="version-search"
                type="text"
                placeholder="버전 검색..."
            >


            <div
                id="version-list"
            ></div>


        </section>



        <!-- =================================================
             실행
        ================================================= -->

        <section
            class="launch-section"
        >


            <div
                id="selected-version"
            >
                버전을 선택하세요
            </div>


            <button
                id="launch-button"
                disabled
            >
                게임 실행
            </button>


        </section>


    </aside>


</div>



<script>


    /* =====================================================
       설정
    ===================================================== */

    const CLIENT_ID =
        "YOUR_MICROSOFT_CLIENT_ID";


    const MOJANG_MANIFEST_URL =
        "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json";



    /* =====================================================
       사진 5장
    ===================================================== */

    const backgroundImages = [

        "./images/minecraft-bg.jpg",

        "./images/minecraft-2.jpeg",

        "./images/minecraft-3.jpeg",

        "./images/minecraft-4.jpeg",

        "./images/minecraft-5.jpeg"

    ];


    /*
        현재 사진 번호

        0 = 첫 번째
        1 = 두 번째
        2 = 세 번째
        3 = 네 번째
        4 = 다섯 번째
    */

    let currentImageIndex = 0;



    /* =====================================================
       DOM
    ===================================================== */

    const gameImage =
        document.getElementById(
            "gameImage"
        );


    const indicatorContainer =
        document.getElementById(
            "image-indicators"
        );


    const versionList =
        document.getElementById(
            "version-list"
        );


    const versionSearch =
        document.getElementById(
            "version-search"
        );


    const launchButton =
        document.getElementById(
            "launch-button"
        );


    const loginButton =
        document.getElementById(
            "login-button"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const progressBar =
        document.getElementById(
            "progress-bar"
        );


    const progressText =
        document.getElementById(
            "progress-text"
        );


    const selectedVersionText =
        document.getElementById(
            "selected-version"
        );


    const logPanel =
        document.getElementById(
            "log-panel"
        );



    /* =====================================================
       상태
    ===================================================== */

    let versions = [];

    let currentFilter = "release";

    let selectedVersion = null;



    /* =====================================================
       사진 인디케이터 생성
    ===================================================== */

    function createImageIndicators() {


        indicatorContainer.innerHTML =
            "";


        for (
            let i = 0;
            i < backgroundImages.length;
            i++
        ) {


            const indicator =
                document.createElement(
                    "button"
                );


            indicator.type =
                "button";


            indicator.className =
                "image-indicator";


            indicator.setAttribute(
                "aria-label",
                `${i + 1}번째 사진 보기`
            );


            /*
                클릭하면 해당 사진으로 이동
            */

            indicator.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();

                    showBackgroundImage(i);

                }
            );


            indicatorContainer.appendChild(
                indicator
            );

        }


        updateIndicators();

    }



    /* =====================================================
       현재 인디케이터 표시
    ===================================================== */

    function updateIndicators() {


        const indicators =
            document.querySelectorAll(
                ".image-indicator"
            );


        indicators.forEach(
            function(
                indicator,
                index
            ) {


                if (
                    index ===
                    currentImageIndex
                ) {

                    indicator.classList.add(
                        "active"
                    );

                } else {

                    indicator.classList.remove(
                        "active"
                    );

                }

            }
        );

    }



    /* =====================================================
       특정 사진으로 이동
    ===================================================== */

    function showBackgroundImage(
        index
    ) {


        /*
            잘못된 번호 방지
        */

        if (
            index < 0 ||
            index >= backgroundImages.length
        ) {

            return;

        }


        /*
            같은 사진이면
            인디케이터만 갱신
        */

        if (
            index === currentImageIndex
        ) {

            updateIndicators();

            return;

        }


        /*
            현재 사진 숨기기
        */

        gameImage.classList.add(
            "fade-out"
        );


        setTimeout(
            function() {


                currentImageIndex =
                    index;


                /*
                    이미지 변경
                */

                gameImage.src =
                    backgroundImages[
                        currentImageIndex
                    ];


                /*
                    이미지가 준비되면
                    다시 나타나게 함
                */

                gameImage.onload =
                    function() {


                        gameImage.classList.remove(
                            "fade-out"
                        );


                        updateIndicators();

                    };


                /*
                    혹시 캐시 때문에
                    onload가 이미 처리된 경우
                */

                if (
                    gameImage.complete
                ) {

                    gameImage.classList.remove(
                        "fade-out"
                    );


                    updateIndicators();

                }

            },
            300
        );

    }



    /* =====================================================
       다음 사진
    ===================================================== */

    function changeBackgroundImage() {


        let nextIndex =
            currentImageIndex + 1;


        /*
            5번째 → 1번째
        */

        if (
            nextIndex >=
            backgroundImages.length
        ) {

            nextIndex = 0;

        }


        showBackgroundImage(
            nextIndex
        );

    }



    /* =====================================================
       15초마다 자동 전환
    ===================================================== */

    setInterval(
        changeBackgroundImage,
        15000
    );



    /* =====================================================
       로그
    ===================================================== */

    function addLog(
        message,
        type = "normal"
    ) {


        const line =
            document.createElement(
                "div"
            );


        line.className =
            "log-line";


        if (
            type === "success"
        ) {

            line.classList.add(
                "log-success"
            );

        }


        if (
            type === "error"
        ) {

            line.classList.add(
                "log-error"
            );

        }


        if (
            type === "info"
        ) {

            line.classList.add(
                "log-info"
            );

        }


        const time =
            new Date()
                .toLocaleTimeString();


        line.textContent =
            `[${time}] ${message}`;


        logPanel.appendChild(
            line
        );


        logPanel.scrollTop =
            logPanel.scrollHeight;

    }



    /* =====================================================
       기본 버전
    ===================================================== */

    const fallbackVersions = [

        {
            id: "1.21.8",
            type: "release"
        },

        {
            id: "1.21.7",
            type: "release"
        },

        {
            id: "1.21.6",
            type: "release"
        },

        {
            id: "1.21.5",
            type: "release"
        },

        {
            id: "1.21.4",
            type: "release"
        },

        {
            id: "1.21.3",
            type: "release"
        },

        {
            id: "1.21.2",
            type: "release"
        },

        {
            id: "1.21.1",
            type: "release"
        },

        {
            id: "1.21",
            type: "release"
        },

        {
            id: "1.20.6",
            type: "release"
        },

        {
            id: "1.20.4",
            type: "release"
        },

        {
            id: "1.20.2",
            type: "release"
        },

        {
            id: "1.20.1",
            type: "release"
        },

        {
            id: "1.19.4",
            type: "release"
        },

        {
            id: "1.19.3",
            type: "release"
        },

        {
            id: "1.18.2",
            type: "release"
        },

        {
            id: "1.17.1",
            type: "release"
        },

        {
            id: "1.16.5",
            type: "release"
        },

        {
            id: "1.12.2",
            type: "release"
        },

        {
            id: "1.8.9",
            type: "release"
        }

    ];



    /* =====================================================
       Mojang 버전 목록
    ===================================================== */

    async function loadVersions() {


        addLog(
            "Minecraft 버전 목록을 불러오는 중...",
            "info"
        );


        try {


            const response =
                await fetch(
                    MOJANG_MANIFEST_URL
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "버전 목록 요청 실패"
                );

            }


            const data =
                await response.json();


            if (
                !data ||
                !Array.isArray(
                    data.versions
                )
            ) {

                throw new Error(
                    "잘못된 버전 데이터"
                );

            }


            versions =
                data.versions.map(
                    function(version) {

                        return {

                            id:
                                version.id,

                            type:
                                version.type,

                            url:
                                version.url,

                            time:
                                version.time,

                            releaseTime:
                                version.releaseTime

                        };

                    }
                );


            addLog(
                `${versions.length}개의 Minecraft 버전을 불러왔습니다.`,
                "success"
            );


        } catch (error) {


            console.error(error);


            versions =
                fallbackVersions;


            addLog(
                "버전 목록을 가져오지 못했습니다. 기본 목록을 사용합니다.",
                "error"
            );

        }


        renderVersions();

    }



    /* =====================================================
       버전 렌더링
    ===================================================== */

    function renderVersions() {


        versionList.innerHTML =
            "";


        const searchText =
            versionSearch.value
                .trim()
                .toLowerCase();


        const filteredVersions =
            versions.filter(
                function(version) {


                    if (
                        currentFilter !==
                        "all" &&
                        version.type !==
                        currentFilter
                    ) {

                        return false;

                    }


                    if (
                        searchText &&
                        !version.id
                            .toLowerCase()
                            .includes(
                                searchText
                            )
                    ) {

                        return false;

                    }


                    return true;

                }
            );



        if (
            filteredVersions.length === 0
        ) {


            const empty =
                document.createElement(
                    "div"
                );


            empty.style.padding =
                "15px";


            empty.style.textAlign =
                "center";


            empty.style.color =
                "#777";


            empty.textContent =
                "버전이 없습니다.";


            versionList.appendChild(
                empty
            );


            return;

        }



        filteredVersions.forEach(
            function(version) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "version-item";


                if (
                    selectedVersion &&
                    selectedVersion.id ===
                    version.id
                ) {

                    item.classList.add(
                        "selected"
                    );

                }


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "version-name";


                name.textContent =
                    version.id;


                const type =
                    document.createElement(
                        "div"
                    );


                type.className =
                    "version-type";


                type.textContent =
                    version.type ===
                    "release"
                        ? "Release"
                        : "Snapshot";


                item.appendChild(
                    name
                );


                item.appendChild(
                    type
                );


                item.addEventListener(
                    "click",
                    function() {

                        selectVersion(
                            version
                        );

                    }
                );


                versionList.appendChild(
                    item
                );

            }
        );

    }



    /* =====================================================
       버전 선택
    ===================================================== */

    function selectVersion(
        version
    ) {


        selectedVersion =
            version;


        selectedVersionText.textContent =
            `선택됨: ${version.id}`;


        launchButton.disabled =
            false;


        renderVersions();


        addLog(
            `Minecraft ${version.id} 선택`,
            "info"
        );

    }



    /* =====================================================
       필터
    ===================================================== */

    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(
            function(button) {


                button.addEventListener(
                    "click",
                    function() {


                        document
                            .querySelectorAll(
                                ".filter-button"
                            )
                            .forEach(
                                function(btn) {

                                    btn.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        currentFilter =
                            button.dataset.filter;


                        renderVersions();

                    }
                );

            }
        );



    /* =====================================================
       검색
    ===================================================== */

    versionSearch.addEventListener(
        "input",
        function() {

            renderVersions();

        }
    );



    /* =====================================================
       Microsoft 로그인
    ===================================================== */

    loginButton.addEventListener(
        "click",
        function() {


            addLog(
                "Microsoft 로그인 버튼을 눌렀습니다.",
                "info"
            );


            if (
                CLIENT_ID ===
                "YOUR_MICROSOFT_CLIENT_ID"
            ) {


                alert(
                    "Microsoft OAuth Client ID를 설정해야 합니다."
                );


                addLog(
                    "Microsoft Client ID가 설정되지 않았습니다.",
                    "error"
                );


                return;

            }


            addLog(
                "Microsoft 인증을 시작합니다...",
                "info"
            );

        }
    );



    /* =====================================================
       게임 실행
    ===================================================== */

    launchButton.addEventListener(
        "click",
        async function() {


            if (
                !selectedVersion
            ) {


                alert(
                    "Minecraft 버전을 먼저 선택하세요."
                );


                return;

            }


            addLog(
                `Minecraft ${selectedVersion.id} 실행 준비...`,
                "info"
            );


            loading.classList.add(
                "active"
            );


            launchButton.disabled =
                true;


            let progress = 0;


            progressBar.style.width =
                "0%";


            progressText.textContent =
                "0%";


            /*
                현재는 UI 테스트용
            */

            while (
                progress < 100
            ) {


                await new Promise(
                    function(resolve) {

                        setTimeout(
                            resolve,
                            80
                        );

                    }
                );


                progress += 2;


                if (
                    progress > 100
                ) {

                    progress = 100;

                }


                progressBar.style.width =
                    `${progress}%`;


                progressText.textContent =
                    `${progress}%`;

            }


            addLog(
                `Minecraft ${selectedVersion.id} 실행 준비 완료`,
                "success"
            );


            await new Promise(
                function(resolve) {

                    setTimeout(
                        resolve,
                        500
                    );

                }
            );


            loading.classList.remove(
                "active"
            );


            launchButton.disabled =
                false;


            addLog(
                "현재 버전에서는 실제 Minecraft Java 실행 엔진이 연결되지 않았습니다.",
                "info"
            );

        }
    );



    /* =====================================================
       초기화
    ===================================================== */

    createImageIndicators();


    addLog(
        "MojoCraft Web Launcher 시작",
        "success"
    );


    addLog(
        "사진 5장을 15초마다 자동으로 전환합니다.",
        "info"
    );


    loadVersions();


</script>


</body>

</html>
