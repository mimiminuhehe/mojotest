<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MojoCraft Web</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
            background: #111;
            color: #fff;
        }

        body {
            display: flex;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        #main-content {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        /* =========================
           GAME SCREEN
        ========================= */

        #screen-container {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: #000;
        }

        #gameImage {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
        }

        /* 이미지 위 어두운 효과 */
        #screen-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.18)
                );
        }

        /* =========================
           GAME OVERLAY
        ========================= */

        #game-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        .crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            opacity: 0.8;
        }

        .crosshair::before,
        .crosshair::after {
            content: "";
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
        }

        .crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }

        .crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }

        .debug {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.55);
            font-size: 12px;
            color: #fff;
        }

        /* =========================
           LOADING
        ========================= */

        #loading {
            position: absolute;
            inset: 0;
            z-index: 20;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.82);
        }

        #loading.show {
            display: flex;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #55d66b;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin-bottom: 20px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #loadingText {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .progress {
            width: min(420px, 70%);
            height: 8px;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #55d66b;
            transition: width 0.25s ease;
        }

        /* =========================
           LOG PANEL
        ========================= */

        #log-panel {
            height: 150px;
            flex-shrink: 0;

            overflow-y: auto;

            background: #0b0b0b;
            border-top: 1px solid #242424;

            padding: 10px;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 5px;
            line-height: 1.4;
            color: #aaa;
        }

        .log-entry.info {
            color: #bdbdbd;
        }

        .log-entry.success {
            color: #62df78;
        }

        .log-entry.warning {
            color: #e9c85d;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        /* =========================
           SIDEBAR
        ========================= */

        #sidebar {
            width: 320px;
            height: 100vh;
            flex-shrink: 0;

            background: #181818;

            border-left: 1px solid #2b2b2b;

            padding: 22px;

            overflow-y: auto;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            margin-bottom: 28px;
        }

        .logo-main {
            font-size: 25px;
            font-weight: 800;
            color: #55d66b;
            letter-spacing: -1px;
        }

        .logo-sub {
            margin-top: 3px;
            color: #777;
            font-size: 12px;
        }

        /* =========================
           ACCOUNT CARD
        ========================= */

        .account-card {
            display: flex;
            align-items: center;

            padding: 13px;

            border-radius: 10px;

            background: #222;

            border: 1px solid #303030;

            margin-bottom: 14px;
        }

        .avatar {
            width: 45px;
            height: 45px;

            border-radius: 8px;

            background: #333;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 11px;

            font-size: 22px;
        }

        .user-info {
            min-width: 0;
        }

        .username {
            font-size: 14px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            margin-top: 4px;

            font-size: 11px;

            color: #777;
        }

        .status.logged-in {
            color: #55d66b;
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .btn-login {
            width: 100%;

            border: 1px solid #444;

            background: #252525;
            color: #fff;

            border-radius: 8px;

            padding: 11px;

            cursor: pointer;

            font-size: 13px;

            transition:
                background 0.15s,
                border-color 0.15s;
        }

        .btn-login:hover {
            background: #303030;
            border-color: #555;
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            height: 1px;
            background: #2b2b2b;

            margin: 22px 0;
        }

        /* =========================
           FORM
        ========================= */

        .version-group {
            margin-bottom: 15px;
        }

        .version-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            color: #999;
        }

        select {
            width: 100%;

            padding: 11px 12px;

            border-radius: 8px;

            border: 1px solid #333;

            background: #222;

            color: #fff;

            outline: none;

            cursor: pointer;

            font-size: 13px;
        }

        select:hover {
            border-color: #4a4a4a;
        }

        select:focus {
            border-color: #55d66b;
        }

        /* =========================
           SEARCH
        ========================= */

        #versionSearch {
            width: 100%;

            padding: 11px 12px;

            margin-top: 8px;

            border-radius: 8px;

            border: 1px solid #333;

            background: #222;

            color: #fff;

            outline: none;

            font-size: 13px;
        }

        #versionSearch:focus {
            border-color: #55d66b;
        }

        /* =========================
           LAUNCH BUTTON
        ========================= */

        .btn-launch {
            width: 100%;

            border: none;

            background: #55d66b;
            color: #071008;

            border-radius: 9px;

            padding: 14px;

            margin-top: 8px;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.1s,
                background 0.15s;
        }

        .btn-launch:hover {
            background: #6ae47d;
        }

        .btn-launch:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           SMALL INFO
        ========================= */

        .small-info {
            margin-top: 18px;

            color: #666;

            font-size: 11px;

            line-height: 1.5;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            body {
                flex-direction: column;
                overflow: auto;
            }

            #main-content {
                width: 100%;
                height: 70vh;
                min-height: 500px;
            }

            #sidebar {
                width: 100%;
                height: auto;

                border-left: none;
                border-top: 1px solid #2b2b2b;
            }
        }

        @media (max-width: 500px) {

            #main-content {
                height: 65vh;
                min-height: 430px;
            }

            #log-panel {
                height: 120px;
            }

            #sidebar {
                padding: 18px;
            }

            .logo {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main id="main-content">

        <!-- GAME / IMAGE SCREEN -->
        <section id="screen-container">

            <img
                id="gameImage"
                src="images/minecraft-bg.jpg"
                alt="Minecraft"
            >

            <div id="game-overlay">

                <div class="crosshair"></div>

                <div class="debug">
                    MojoCraft Web
                </div>

            </div>

            <!-- LOADING -->
            <div id="loading">

                <div class="spinner"></div>

                <div id="loadingText">
                    준비 중...
                </div>

                <div class="progress">
                    <div id="progressBar"></div>
                </div>

            </div>

        </section>


        <!-- LOG -->
        <section id="log-panel"></section>

    </main>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside id="sidebar">

        <!-- LOGO -->
        <div class="logo">

            <div class="logo-main">
                MojoCraft
            </div>

            <div class="logo-sub">
                Web Minecraft Launcher
            </div>

        </div>


        <!-- ACCOUNT -->
        <div class="account-card">

            <div class="avatar">
                ⛏️
            </div>

            <div class="user-info">

                <div
                    id="username"
                    class="username"
                >
                    로그인되지 않음
                </div>

                <div
                    id="accountStatus"
                    class="status"
                >
                    Microsoft 계정 필요
                </div>

            </div>

        </div>


        <!-- LOGIN -->
        <button
            id="loginButton"
            class="btn-login"
        >
            Microsoft 로그인
        </button>


        <div class="divider"></div>


        <!-- VERSION FILTER -->
        <div class="version-group">

            <label for="versionFilter">
                버전 종류
            </label>

            <select id="versionFilter">

                <option value="release">
                    Release
                </option>

                <option value="snapshot">
                    Snapshot
                </option>

                <option value="all">
                    전체
                </option>

            </select>

        </div>


        <!-- VERSION -->
        <div class="version-group">

            <label for="versionSelect">
                Minecraft Java Edition
            </label>

            <select id="versionSelect">

                <option value="">
                    버전 불러오는 중...
                </option>

            </select>

            <input
                id="versionSearch"
                type="text"
                placeholder="버전 검색..."
            >

        </div>


        <!-- LAUNCH -->
        <button
            id="launchButton"
            class="btn-launch"
        >
            게임 실행
        </button>


        <div class="small-info">

            현재 버전 목록은 Mojang의 공식
            Minecraft Java Edition 버전 Manifest를
            기준으로 불러옵니다.

            <br>
            <br>

            ※ 현재 이 버전은 런처 UI 및 실행 프로토타입입니다.
            실제 Java Minecraft 실행 엔진은 아직 연결되지 않았습니다.

        </div>

    </aside>


    <script>

        /* =========================================
           CONFIG
        ========================================= */

        const CLIENT_ID =
            "YOUR_MICROSOFT_CLIENT_ID";

        const MOJANG_MANIFEST_URL =
            "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json";


        /* =========================================
           STATE
        ========================================= */

        let allVersions = [];

        let currentFilter = "release";

        let currentSearch = "";

        let selectedVersion = null;


        /* =========================================
           ELEMENTS
        ========================================= */

        const versionSelect =
            document.getElementById("versionSelect");

        const versionFilter =
            document.getElementById("versionFilter");

        const versionSearch =
            document.getElementById("versionSearch");

        const launchButton =
            document.getElementById("launchButton");

        const loginButton =
            document.getElementById("loginButton");

        const loading =
            document.getElementById("loading");

        const loadingText =
            document.getElementById("loadingText");

        const progressBar =
            document.getElementById("progressBar");

        const logPanel =
            document.getElementById("log-panel");

        const username =
            document.getElementById("username");

        const accountStatus =
            document.getElementById("accountStatus");


        /* =========================================
           LOG
        ========================================= */

        function log(
            message,
            type = "info"
        ) {

            const entry =
                document.createElement("div");

            entry.className =
                "log-entry " + type;

            const time =
                new Date().toLocaleTimeString();

            entry.textContent =
                `[${time}] ${message}`;

            logPanel.appendChild(entry);

            logPanel.scrollTop =
                logPanel.scrollHeight;
        }


        /* =========================================
           LOADING
        ========================================= */

        function setLoading(
            visible,
            text = "",
            progress = 0
        ) {

            if (visible) {

                loading.classList.add("show");

                loadingText.textContent =
                    text;

                progressBar.style.width =
                    `${progress}%`;

            } else {

                loading.classList.remove("show");

            }
        }


        /* =========================================
           FETCH VERSION MANIFEST
        ========================================= */

        async function fetchVersionManifest() {

            log(
                "Minecraft 버전 목록을 불러오는 중..."
            );

            try {

                const response =
                    await fetch(
                        MOJANG_MANIFEST_URL,
                        {
                            cache: "no-store"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const data =
                    await response.json();

                if (
                    !data.versions ||
                    !Array.isArray(data.versions)
                ) {

                    throw new Error(
                        "버전 목록 형식이 올바르지 않습니다."
                    );

                }

                allVersions =
                    data.versions;

                log(
                    `${allVersions.length}개의 Minecraft 버전을 불러왔습니다.`,
                    "success"
                );

                renderVersions();

            } catch (error) {

                console.error(error);

                log(
                    "공식 버전 목록을 불러오지 못했습니다.",
                    "error"
                );

                /*
                 * 네트워크 오류가 발생했을 때
                 * 화면 자체가 완전히 비어버리지 않도록
                 * 기본 버전 몇 개만 표시합니다.
                 */

                allVersions = [

                    {
                        id: "26.1.2",
                        type: "release"
                    },

                    {
                        id: "1.21.8",
                        type: "release"
                    },

                    {
                        id: "1.21.7",
                        type: "release"
                    },

                    {
                        id: "1.21.6",
                        type: "release"
                    },

                    {
                        id: "1.21.5",
                        type: "release"
                    },

                    {
                        id: "1.21.4",
                        type: "release"
                    },

                    {
                        id: "1.21.3",
                        type: "release"
                    },

                    {
                        id: "1.21.2",
                        type: "release"
                    },

                    {
                        id: "1.21.1",
                        type: "release"
                    },

                    {
                        id: "1.21",
                        type: "release"
                    },

                    {
                        id: "1.20.1",
                        type: "release"
                    },

                    {
                        id: "1.19.4",
                        type: "release"
                    }

                ];

                renderVersions();
            }
        }


        /* =========================================
           RENDER VERSION LIST
        ========================================= */

        function renderVersions() {

            versionSelect.innerHTML = "";

            let filtered =
                allVersions.filter(
                    version => {

                        /*
                         * 종류 필터
                         */

                        if (
                            currentFilter !== "all" &&
                            version.type !== currentFilter
                        ) {

                            return false;

                        }

                        /*
                         * 검색 필터
                         */

                        if (
                            currentSearch &&
                            !version.id
                                .toLowerCase()
                                .includes(
                                    currentSearch.toLowerCase()
                                )
                        ) {

                            return false;

                        }

                        return true;
                    }
                );


            if (filtered.length === 0) {

                const option =
                    document.createElement("option");

                option.value = "";

                option.textContent =
                    "검색 결과 없음";

                versionSelect.appendChild(
                    option
                );

                selectedVersion = null;

                return;
            }


            /*
             * 최신 버전을 위쪽에 표시
             *
             * Mojang Manifest 자체가
             * 최신순으로 제공하지만,
             * 여기서는 안전하게 날짜를 기준으로
             * 다시 정렬합니다.
             */

            filtered.sort(
                (a, b) => {

                    const dateA =
                        new Date(
                            a.releaseTime || 0
                        );

                    const dateB =
                        new Date(
                            b.releaseTime || 0
                        );

                    return dateB - dateA;
                }
            );


            for (const version of filtered) {

                const option =
                    document.createElement("option");

                option.value =
                    version.id;

                option.textContent =
                    `${version.id} (${version.type})`;

                versionSelect.appendChild(
                    option
                );

            }


            selectedVersion =
                filtered[0];

            versionSelect.value =
                selectedVersion.id;


            log(
                `현재 표시된 버전: ${filtered.length}개`
            );
        }


        /* =========================================
           VERSION FILTER
        ========================================= */

        versionFilter.addEventListener(
            "change",
            () => {

                currentFilter =
                    versionFilter.value;

                renderVersions();

            }
        );


        /* =========================================
           VERSION SEARCH
        ========================================= */

        versionSearch.addEventListener(
            "input",
            () => {

                currentSearch =
                    versionSearch.value.trim();

                renderVersions();

            }
        );


        /* =========================================
           VERSION SELECT
        ========================================= */

        versionSelect.addEventListener(
            "change",
            () => {

                const id =
                    versionSelect.value;

                selectedVersion =
                    allVersions.find(
                        version =>
                            version.id === id
                    ) || null;

                if (selectedVersion) {

                    log(
                        `선택한 버전: ${selectedVersion.id}`
                    );

                }

            }
        );


        /* =========================================
           MICROSOFT LOGIN
        ========================================= */

        function startMicrosoftLogin() {

            /*
             * 주의:
             *
             * Microsoft OAuth의 client secret을
             * 브라우저 코드에 넣으면 안 됩니다.
             *
             * 실제 로그인 구현에서는
             * Authorization Code + PKCE 방식을
             * 사용해야 합니다.
             */

            if (
                !CLIENT_ID ||
                CLIENT_ID ===
                "YOUR_MICROSOFT_CLIENT_ID"
            ) {

                log(
                    "Microsoft Client ID가 아직 설정되지 않았습니다.",
                    "warning"
                );

                alert(
                    "먼저 Microsoft Entra에서 Client ID를 설정해야 합니다."
                );

                return;
            }


            const redirectUri =
                window.location.origin +
                window.location.pathname;


            const params =
                new URLSearchParams({

                    client_id:
                        CLIENT_ID,

                    response_type:
                        "code",

                    redirect_uri:
                        redirectUri,

                    response_mode:
                        "query",

                    scope:
                        "XboxLive.signin offline_access",

                    code_challenge:
                        "PKCE_CODE_CHALLENGE",

                    code_challenge_method:
                        "S256"

                });


            const authUrl =
                "https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize?" +
                params.toString();


            log(
                "Microsoft 로그인 페이지로 이동합니다..."
            );

            window.location.href =
                authUrl;
        }


        loginButton.addEventListener(
            "click",
            startMicrosoftLogin
        );


        /* =========================================
           SIMULATED LAUNCH
        ========================================= */

        function sleep(ms) {

            return new Promise(
                resolve =>
                    setTimeout(resolve, ms)
            );

        }


        async function launchGame() {

            if (!selectedVersion) {

                alert(
                    "Minecraft 버전을 선택해주세요."
                );

                return;
            }


            /*
             * 현재는 실제 Java 실행이 아니라
             * 런처 동작을 보여주는 프로토타입입니다.
             */

            launchButton.disabled =
                true;

            loginButton.disabled =
                true;


            setLoading(
                true,
                "Minecraft 실행 준비 중...",
                5
            );


            log(
                `Minecraft ${selectedVersion.id} 실행 준비`,
                "info"
            );

            await sleep(500);


            setLoading(
                true,
                "버전 정보 확인 중...",
                20
            );

            log(
                "Minecraft 버전 정보 확인"
            );

            await sleep(600);


            setLoading(
                true,
                "라이브러리 확인 중...",
                40
            );

            log(
                "Minecraft 라이브러리 확인"
            );

            await sleep(600);


            setLoading(
                true,
                "게임 리소스 준비 중...",
                60
            );

            log(
                "게임 리소스 준비"
            );

            await sleep(600);


            setLoading(
                true,
                "Java 실행 환경 준비 중...",
                80
            );

            log(
                "Java 실행 환경 준비"
            );

            await sleep(700);


            setLoading(
                true,
                "Minecraft 시작 중...",
                100
            );

            log(
                "Minecraft 시작 요청",
                "success"
            );

            await sleep(800);


            setLoading(
                false
            );


            launchButton.disabled =
                false;

            loginButton.disabled =
                false;


            log(
                "현재는 UI 프로토타입입니다. 실제 Minecraft Java 엔진은 아직 연결되지 않았습니다.",
                "warning"
            );

        }


        launchButton.addEventListener(
            "click",
            launchGame
        );


        /* =========================================
           STARTUP
        ========================================= */

        async function startup() {

            log(
                "MojoCraft Web Launcher 시작"
            );

            log(
                "웹 런처 초기화 중..."
            );

            await fetchVersionManifest();

            log(
                "런처 초기화 완료",
                "success"
            );

        }


        /* =========================================
           START
        ========================================= */

        window.addEventListener(
            "load",
            startup
        );

    </script>

</body>
</html>
