<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MojoCraft Web</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background: #101014;
    color: #fff;

    display: flex;

    overflow: hidden;
}


/* =========================================
   메인 화면
   ========================================= */

#main-content {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;

    position: relative;
}

#screen-container {
    flex: 1;

    position: relative;

    overflow: hidden;

    background: #000;
}

#gameImage {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    user-select: none;
    pointer-events: none;

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}


/* =========================================
   이미지 어두운 오버레이
   ========================================= */

#screen-overlay {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.25)
        );

    pointer-events: none;
}


/* =========================================
   이미지 인디케이터
   ========================================= */

#image-indicators {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 22px;

    width: 100%;

    display: flex;

    flex-direction: row;

    align-items: center;
    justify-content: center;

    gap: 10px;

    z-index: 1000;

    pointer-events: auto;
}

.image-indicator {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 16px;
    height: 16px;

    min-width: 16px;
    min-height: 16px;

    margin: 0;
    padding: 0;

    border: 2px solid rgba(255,255,255,0.95);

    border-radius: 50%;

    background: rgba(0,0,0,0.35);

    box-shadow:
        0 1px 5px rgba(0,0,0,0.7);

    cursor: pointer;

    pointer-events: auto;

    opacity: 1;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.image-indicator:hover {
    transform: scale(1.15);
}

.image-indicator.active {
    background: #fff;

    border-color: #fff;

    transform: scale(1.15);

    box-shadow:
        0 1px 7px rgba(0,0,0,0.8);
}


/* =========================================
   로그
   ========================================= */

#log-panel {
    height: 150px;

    flex-shrink: 0;

    background: #0d0d0e;

    border-top:
        1px solid #2a2a30;

    padding: 10px;

    font-family: monospace;

    font-size: 12px;

    overflow-y: auto;

    color: #aaa;

    z-index: 10;
}

.log-entry {
    margin-bottom: 4px;
}

.log-entry.info {
    color: #888;
}

.log-entry.success {
    color: #4CAF50;
}

.log-entry.error {
    color: #f44336;
}


/* =========================================
   오른쪽 사이드바
   ========================================= */

#sidebar {
    width: 320px;

    flex-shrink: 0;

    background: #121214;

    padding: 20px;

    display: flex;
    flex-direction: column;

    gap: 16px;

    border-left:
        1px solid #2a2a30;
}


/* =========================================
   로고
   ========================================= */

.logo {
    font-size: 24px;

    font-weight: bold;

    color: #4CAF50;

    text-align: center;
}


/* =========================================
   계정 카드
   ========================================= */

.account-card {
    background: #2a2a30;

    padding: 15px;

    border-radius: 8px;

    display: flex;

    align-items: center;

    gap: 12px;
}

.avatar {
    width: 40px;
    height: 40px;

    background: #444;

    border-radius: 4px;

    object-fit: cover;
}

.user-info {
    display: flex;

    flex-direction: column;

    min-width: 0;
}

.username {
    font-weight: bold;

    font-size: 14px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.status {
    font-size: 12px;

    color: #888;
}


/* =========================================
   버튼
   ========================================= */

button {
    padding: 12px;

    border: none;

    border-radius: 6px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.1s,
        opacity 0.2s;
}

button:active {
    transform: scale(0.98);
}


/* 로그인 */

.btn-login {
    background: #0078d4;

    color: white;
}

.btn-login:hover {
    background: #005a9e;
}


/* 실행 */

.btn-launch {
    background: #76ff03;

    color: #000;

    font-size: 18px;

    margin-top: auto;
}

.btn-launch:hover {
    background: #64dd17;
}

.btn-launch:disabled {
    background: #555;

    color: #888;

    cursor: not-allowed;
}


/* =========================================
   버전 영역
   ========================================= */

.version-group {
    display: flex;

    flex-direction: column;

    gap: 6px;
}

.version-group label {
    font-size: 12px;

    color: #aaa;
}

select {
    padding: 10px;

    background: #2a2a30;

    color: white;

    border:
        1px solid #444;

    border-radius: 4px;

    outline: none;

    cursor: pointer;

    width: 100%;
}

select:disabled {
    cursor: wait;

    opacity: 0.6;
}


/* =========================================
   버전 상태
   ========================================= */

#version-status {
    font-size: 11px;

    color: #777;

    line-height: 1.4;

    min-height: 15px;
}


/* =========================================
   로딩 화면
   ========================================= */

#loading {
    position: fixed;

    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,0.75);

    backdrop-filter:
        blur(5px);
}

.loading-box {
    width: min(420px, 90vw);

    background: #18181c;

    border:
        1px solid #333;

    border-radius: 12px;

    padding: 24px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5);
}

.loading-title {
    font-size: 18px;

    font-weight: bold;

    margin-bottom: 15px;
}

.loading-text {
    color: #aaa;

    font-size: 13px;

    margin-bottom: 15px;
}

.progress-background {
    width: 100%;

    height: 8px;

    background: #333;

    border-radius: 20px;

    overflow: hidden;
}

#loading-progress {
    width: 0%;

    height: 100%;

    background: #76ff03;

    transition:
        width 0.25s ease;
}

#loading-percent {
    margin-top: 8px;

    text-align: right;

    font-size: 12px;

    color: #888;
}


/* =========================================
   모바일
   ========================================= */

@media (max-width: 800px) {

    body {
        flex-direction: column;
    }

    #main-content {
        min-height: 55vh;
    }

    #sidebar {
        width: 100%;

        height: auto;

        max-height: 45vh;

        overflow-y: auto;

        border-left: none;

        border-top:
            1px solid #2a2a30;
    }

    .btn-launch {
        margin-top: 10px;
    }

    #log-panel {
        height: 100px;
    }
}
</style>
</head>


<body>


<!-- =========================================
     메인 화면
     ========================================= -->

<div id="main-content">

    <div id="screen-container">

        <img
            id="gameImage"
            src="./images/minecraft-bg.jpg"
            alt="Minecraft"
        >

        <div id="screen-overlay"></div>

        <div id="image-indicators"></div>

    </div>


    <div id="log-panel">

        <div class="log-entry info">
            [시스템] MojoCraft Web Launcher 초기화 중...
        </div>

    </div>

</div>



<!-- =========================================
     사이드바
     ========================================= -->

<div id="sidebar">

    <div class="logo">
        MojoCraft Web
    </div>


    <!-- 계정 -->

    <div
        class="account-card"
        id="account-card"
    >

        <img
            id="avatar"
            class="avatar"
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
            alt="Skin"
        >

        <div class="user-info">

            <span
                class="username"
                id="username"
            >
                비로그인
            </span>

            <span
                class="status"
                id="auth-status"
            >
                Microsoft 계정 필요
            </span>

        </div>

    </div>


    <!-- Microsoft 로그인 -->

    <button
        class="btn-login"
        id="login-btn"
        onclick="startMicrosoftOAuth()"
    >
        Microsoft 계정 로그인
    </button>


    <!-- 버전 필터 -->

    <div class="version-group">

        <label for="version-type">
            버전 필터
        </label>

        <select
            id="version-type"
            onchange="filterVersions()"
        >

            <option value="release">
                정식 출시 버전 (Release)
            </option>

            <option value="all">
                전체 버전 (Snapshot/Beta 포함)
            </option>

            <option value="snapshot">
                스냅샷 (Snapshot)
            </option>

        </select>

    </div>


    <!-- Minecraft 버전 -->

    <div class="version-group">

        <label for="java-version">
            자바 마인크래프트 버전 선택
        </label>

        <select
            id="java-version"
            disabled
        >

            <option value="">
                버전 불러오는 중...
            </option>

        </select>

        <div id="version-status"></div>

    </div>


    <!-- 실행 -->

    <button
        class="btn-launch"
        id="launch-btn"
        disabled
        onclick="launchGameEngine()"
    >
        게임 실행
    </button>

</div>



<!-- =========================================
     로딩 화면
     ========================================= -->

<div id="loading">

    <div class="loading-box">

        <div
            class="loading-title"
            id="loading-title"
        >
            MojoCraft 준비 중
        </div>

        <div
            class="loading-text"
            id="loading-text"
        >
            Core Engine으로 연결하는 중...
        </div>

        <div class="progress-background">

            <div
                id="loading-progress"
            ></div>

        </div>

        <div
            id="loading-percent"
        >
            0%
        </div>

    </div>

</div>



<script>

/* =========================================
   설정
   ========================================= */

const MOJANG_MANIFEST_URL =
    "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json";


/*
 * Microsoft OAuth를 실제로 연결할 경우
 * Azure에서 발급받은 Client ID로 변경해야 한다.
 *
 * 현재는 UI만 준비한다.
 */

const CLIENT_ID =
    "00000000-0000-0000-0000-000000000000";


const REDIRECT_URI =
    window.location.origin +
    window.location.pathname;


/* =========================================
   상태
   ========================================= */

let allVersions = [];

let authSession = {

    accessToken: null,

    minecraftToken: null,

    uuid:
        "00000000000000000000000000000000",

    username:
        "Player"

};


/* =========================================
   로그
   ========================================= */

function log(
    message,
    type = "info"
) {

    const logPanel =
        document.getElementById(
            "log-panel"
        );

    if (!logPanel) {
        return;
    }

    const entry =
        document.createElement(
            "div"
        );

    entry.className =
        `log-entry ${type}`;

    entry.innerText =
        `[${new Date().toLocaleTimeString()}] ${message}`;

    logPanel.appendChild(entry);

    logPanel.scrollTop =
        logPanel.scrollHeight;
}


/* =========================================
   이미지 슬라이드
   ========================================= */

const gameImages = [

    "./images/minecraft-bg.jpg",

    "./images/minecraft-2.jpeg",

    "./images/minecraft-3.jpeg",

    "./images/minecraft-4.jpeg",

    "./images/minecraft-5.jpeg"

];

let currentImageIndex = 0;

let imageTimer = null;


/* 이미지 표시 */

function showGameImage(index) {

    const image =
        document.getElementById(
            "gameImage"
        );

    const indicators =
        document.querySelectorAll(
            ".image-indicator"
        );

    if (!image) {
        return;
    }

    if (
        index < 0 ||
        index >= gameImages.length
    ) {
        return;
    }

    currentImageIndex = index;


    /*
     * 페이드 효과
     */

    image.style.opacity = "0";


    setTimeout(() => {

        image.src =
            gameImages[index];

        image.style.opacity = "1";

    }, 250);


    /*
     * 인디케이터 업데이트
     */

    indicators.forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );

        }
    );

}


/* 자동 이미지 변경 */

function startImageRotation() {

    if (imageTimer) {

        clearInterval(
            imageTimer
        );

    }

    imageTimer =
        setInterval(() => {

            let next =
                currentImageIndex + 1;

            if (
                next >= gameImages.length
            ) {
                next = 0;
            }

            showGameImage(next);

        }, 15000);

}


/* 인디케이터 생성 */

function createImageIndicators() {

    const container =
        document.getElementById(
            "image-indicators"
        );

    if (!container) {
        return;
    }

    container.innerHTML = "";


    gameImages.forEach(
        (image, index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "image-indicator";


            if (index === 0) {

                button.classList.add(
                    "active"
                );

            }


            button.setAttribute(
                "aria-label",
                `이미지 ${index + 1}`
            );


            button.addEventListener(
                "click",
                () => {

                    showGameImage(
                        index
                    );

                    startImageRotation();

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================
   Mojang 버전 Manifest
   ========================================= */

async function fetchVersionManifest() {

    try {

        log(
            "Mojang 공식 버전 Manifest를 불러오는 중...",
            "info"
        );


        const response =
            await fetch(
                MOJANG_MANIFEST_URL
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !Array.isArray(
                data.versions
            )
        ) {

            throw new Error(
                "버전 데이터 형식이 올바르지 않습니다."
            );

        }


        allVersions =
            data.versions;


        log(
            `성공: 총 ${allVersions.length}개의 Minecraft Java 버전을 불러왔습니다.`,
            "success"
        );


        filterVersions();


        const select =
            document.getElementById(
                "java-version"
            );

        select.disabled = false;


        updateVersionStatus();


    } catch (error) {

        console.error(error);


        log(
            `Mojang 버전 Manifest 불러오기 실패: ${error.message}`,
            "error"
        );


        const select =
            document.getElementById(
                "java-version"
            );


        select.innerHTML = `
            <option value="">
                버전 로딩 실패
            </option>
        `;

    }

}


/* =========================================
   버전 필터
   ========================================= */

function filterVersions() {

    const typeFilter =
        document.getElementById(
            "version-type"
        ).value;


    const select =
        document.getElementById(
            "java-version"
        );


    select.innerHTML = "";


    const filtered =
        allVersions.filter(
            version => {

                if (
                    typeFilter === "all"
                ) {

                    return true;

                }

                return (
                    version.type ===
                    typeFilter
                );

            }
        );


    filtered.forEach(
        version => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                version.id;


            option.innerText =
                `${version.id} (${version.type})`;


            option.dataset.jsonUrl =
                version.url;


            option.dataset.releaseTime =
                version.releaseTime ||
                "";


            select.appendChild(
                option
            );

        }
    );


    if (
        filtered.length > 0
    ) {

        select.value =
            filtered[0].id;

    }


    updateVersionStatus();

}


/* =========================================
   버전 정보 표시
   ========================================= */

function updateVersionStatus() {

    const select =
        document.getElementById(
            "java-version"
        );

    const status =
        document.getElementById(
            "version-status"
        );


    if (
        !select ||
        !status
    ) {

        return;

    }


    if (
        !select.value
    ) {

        status.textContent =
            "";

        return;

    }


    const option =
        select.options[
            select.selectedIndex
        ];


    const releaseTime =
        option?.dataset?.releaseTime;


    if (releaseTime) {

        const date =
            new Date(
                releaseTime
            );


        if (
            !Number.isNaN(
                date.getTime()
            )
        ) {

            status.textContent =
                `출시일: ${date.toLocaleDateString(
                    "ko-KR"
                )}`;

            return;

        }

    }


    status.textContent =
        "Mojang 공식 버전";


}


/* =========================================
   Microsoft 로그인
   ========================================= */

function startMicrosoftOAuth() {

    log(
        "Microsoft OAuth 로그인 준비 중...",
        "info"
    );


    /*
     * 현재 Client ID가 실제 Azure App ID가 아니므로
     * 여기서는 실제 로그인 페이지로 이동시키지 않는다.
     *
     * 나중에 Azure Client ID를 넣으면
     * OAuth 연결 단계로 확장할 수 있다.
     */

    if (
        !CLIENT_ID ||
        CLIENT_ID ===
        "00000000-0000-0000-0000-000000000000"
    ) {

        log(
            "Microsoft Client ID가 아직 설정되지 않았습니다.",
            "error"
        );

        alert(
            "Microsoft 로그인은 Azure Client ID를 설정한 후 사용할 수 있습니다."
        );

        return;

    }


    const scopes =
        encodeURIComponent(
            "XboxLive.signin offline_access"
        );


    const authUrl =
        "https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize" +
        `?client_id=${encodeURIComponent(CLIENT_ID)}` +
        "&response_type=code" +
        `&redirect_uri=${encodeURIComponent(
            REDIRECT_URI
        )}` +
        `&scope=${scopes}` +
        "&prompt=select_account";


    window.location.href =
        authUrl;

}


/* =========================================
   OAuth Callback
   ========================================= */

function handleOAuthCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const code =
        params.get("code");


    if (!code) {

        return;

    }


    /*
     * 중요:
     * 브라우저에서 받은 authorization code를
     * 바로 Minecraft 토큰으로 바꾸는 것은 아니다.
     *
     * 실제 OAuth token exchange는
     * 별도의 안전한 백엔드가 필요하다.
     */

    log(
        "Microsoft 인증 코드를 수신했습니다.",
        "success"
    );


    log(
        "Token 교환 단계는 별도의 인증 서버 연결이 필요합니다.",
        "info"
    );


    /*
     * URL에서 code 제거
     */

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

}


/* =========================================
   로딩 UI
   ========================================= */

function showLoading(
    title,
    message,
    progress = 0
) {

    const loading =
        document.getElementById(
            "loading"
        );

    const titleElement =
        document.getElementById(
            "loading-title"
        );

    const textElement =
        document.getElementById(
            "loading-text"
        );

    const progressElement =
        document.getElementById(
            "loading-progress"
        );

    const percentElement =
        document.getElementById(
            "loading-percent"
        );


    loading.style.display =
        "flex";


    titleElement.textContent =
        title;


    textElement.textContent =
        message;


    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );


    progressElement.style.width =
        `${progress}%`;


    percentElement.textContent =
        `${Math.round(progress)}%`;

}


function hideLoading() {

    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.display =
        "none";

}


/* =========================================
   핵심:
   index.html → mainpage.html 연결
   ========================================= */

async function launchGameEngine() {

    const versionSelect =
        document.getElementById(
            "java-version"
        );


    const launchButton =
        document.getElementById(
            "launch-btn"
        );


    if (
        !versionSelect ||
        !versionSelect.value
    ) {

        log(
            "먼저 Minecraft 버전을 선택해주세요.",
            "error"
        );

        return;

    }


    const selectedVersion =
        versionSelect.value;


    const selectedOption =
        versionSelect.options[
            versionSelect.selectedIndex
        ];


    const jsonUrl =
        selectedOption?.dataset?.jsonUrl ||
        "";


    /*
     * 버튼 잠금
     */

    launchButton.disabled =
        true;


    showLoading(
        "MojoCraft 준비 중",
        `Minecraft ${selectedVersion} Core Engine으로 연결하는 중...`,
        20
    );


    log(
        `Minecraft ${selectedVersion} 선택`,
        "info"
    );


    try {

        /*
         * mainpage.html에 전달할 파라미터
         */

        const params =
            new URLSearchParams();


        params.set(
            "version",
            selectedVersion
        );


        if (jsonUrl) {

            params.set(
                "json",
                jsonUrl
            );

        }


        /*
         * 로그인 정보가 존재할 경우 전달
         */

        if (
            authSession.username
        ) {

            params.set(
                "username",
                authSession.username
            );

        }


        if (
            authSession.uuid
        ) {

            params.set(
                "uuid",
                authSession.uuid
            );

        }


        /*
         * 현재 인증 토큰이 있다면 전달
         *
         * 실제 서비스에서는 access token을
         * URL에 넣지 않는 것이 좋다.
         */

        /*
        if (authSession.minecraftToken) {
            params.set(
                "token",
                authSession.minecraftToken
            );
        }
        */


        log(
            `Minecraft ${selectedVersion} 실행 준비...`,
            "info"
        );


        showLoading(
            "Core Engine 연결",
            `Minecraft ${selectedVersion} 정보를 전달하는 중...`,
            55
        );


        /*
         * 짧은 지연을 주어 UI가 갱신되도록 함
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );


        log(
            "mainpage.html로 연결합니다.",
            "success"
        );


        showLoading(
            "Core Engine 연결",
            "Minecraft 파일 엔진으로 이동하는 중...",
            100
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    250
                )
        );


        /*
         * ★ 실제 연결 ★
         */

        window.location.href =
            "./mainpage.html?" +
            params.toString();


    } catch (error) {

        console.error(error);


        hideLoading();


        log(
            `Core Engine 연결 실패: ${error.message}`,
            "error"
        );


        launchButton.disabled =
            false;

    }

}


/* =========================================
   초기화
   ========================================= */

window.addEventListener(
    "DOMContentLoaded",
    async () => {

        log(
            "MojoCraft Web Launcher 초기화 완료.",
            "success"
        );


        /*
         * 이미지
         */

        createImageIndicators();

        showGameImage(0);

        startImageRotation();


        /*
         * 버전 선택
         */

        const versionSelect =
            document.getElementById(
                "java-version"
            );


        versionSelect.addEventListener(
            "change",
            updateVersionStatus
        );


        /*
         * OAuth callback 확인
         */

        handleOAuthCallback();


        /*
         * Mojang 버전 목록
         */

        await fetchVersionManifest();


        /*
         * 현재는 실제 Microsoft 로그인 없이도
         * Core Engine 테스트가 가능하도록 한다.
         */

        document.getElementById(
            "launch-btn"
        ).disabled = false;


        log(
            "게임 실행 버튼이 활성화되었습니다.",
            "success"
        );

    }
);

</script>

</body>
</html>
