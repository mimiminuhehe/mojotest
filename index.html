<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MojoCraft Web Launcher</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background: #111;
    color: #fff;
}

/* =========================
   전체 레이아웃
========================= */

#app {
    width: 100%;
    height: 100vh;

    display: flex;
    background: #111;
}

/* =========================
   메인 영역
========================= */

#main {
    flex: 1;
    min-width: 0;
    height: 100%;

    position: relative;

    overflow: hidden;

    background: #000;
}

/* 배경 이미지 */

#gameImage {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    left: 0;
    top: 0;

    opacity: 1;

    transition:
        opacity 0.5s ease,
        transform 0.5s ease;

    user-select: none;
    pointer-events: none;
}

/* 어두운 오버레이 */

#imageOverlay {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.20),
            rgba(0,0,0,0.05) 45%,
            rgba(0,0,0,0.70)
        );

    pointer-events: none;
}

/* 중앙 타이틀 */

#centerContent {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    width: min(800px, 90%);

    z-index: 10;

    text-shadow:
        0 2px 10px rgba(0,0,0,0.8),
        0 4px 20px rgba(0,0,0,0.7);
}

#centerContent h1 {
    font-size: clamp(32px, 5vw, 70px);
    font-weight: 800;
    letter-spacing: 2px;
}

#centerContent p {
    margin-top: 10px;

    color: #ddd;

    font-size: clamp(13px, 1.5vw, 18px);
}

/* =========================
   이미지 인디케이터
========================= */

#image-indicators {
    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    z-index: 1000;
}

.image-indicator {
    width: 12px;
    height: 12px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,0.9);

    background: rgba(0,0,0,0.25);

    padding: 0;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        opacity 0.2s ease;
}

.image-indicator:hover {
    transform: scale(1.25);
}

.image-indicator.active {
    background: #fff;

    transform: scale(1.15);
}

/* =========================
   사이드바
========================= */

#sidebar {
    width: 340px;
    min-width: 340px;
    height: 100%;

    background:
        linear-gradient(
            180deg,
            #17171a,
            #101012
        );

    border-left: 1px solid #29292d;

    padding: 20px;

    display: flex;
    flex-direction: column;

    gap: 16px;

    overflow-y: auto;
}

/* 로고 */

.logo {
    text-align: center;

    font-size: 25px;
    font-weight: 800;

    color: #76ff03;

    letter-spacing: 0.5px;

    margin-bottom: 5px;
}

/* =========================
   계정 카드
========================= */

.account-card {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 14px;

    border-radius: 10px;

    background: #252529;

    border: 1px solid #34343a;
}

.avatar {
    width: 44px;
    height: 44px;

    border-radius: 6px;

    background: #444;

    object-fit: cover;

    flex-shrink: 0;
}

.user-info {
    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 3px;
}

.username {
    font-size: 14px;
    font-weight: 700;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status {
    font-size: 12px;
    color: #999;
}

/* =========================
   버튼
========================= */

button {
    font-family: inherit;
}

.btn {
    width: 100%;

    padding: 12px 14px;

    border: none;
    border-radius: 7px;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.1s ease,
        opacity 0.2s ease;
}

.btn:active {
    transform: scale(0.98);
}

.btn:disabled {
    cursor: not-allowed;
    opacity: 0.5;
}

.btn-login {
    background: #0078d4;
    color: #fff;
}

.btn-login:hover {
    background: #106ebe;
}

/* =========================
   버전 영역
========================= */

.version-box {
    display: flex;
    flex-direction: column;

    gap: 7px;
}

.version-box label {
    font-size: 12px;

    color: #aaa;
}

select,
input {
    width: 100%;

    padding: 11px;

    border-radius: 7px;

    border: 1px solid #3a3a40;

    outline: none;

    background: #252529;
    color: #fff;

    font-family: inherit;

    font-size: 13px;
}

select:focus,
input:focus {
    border-color: #76ff03;
}

select:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* =========================
   버전 상태
========================= */

#version-status {
    padding: 9px 10px;

    border-radius: 6px;

    background: #1e1e22;

    border: 1px solid #303036;

    font-size: 11px;

    line-height: 1.5;

    color: #aaa;
}

#version-status.success {
    color: #7CFF55;
}

#version-status.error {
    color: #ff6565;
}

/* =========================
   실행 버튼
========================= */

#launch-btn {
    margin-top: auto;

    padding: 15px;

    border: none;

    border-radius: 8px;

    background: #76ff03;

    color: #000;

    font-size: 18px;
    font-weight: 800;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.1s ease;
}

#launch-btn:hover:not(:disabled) {
    background: #8cff35;
}

#launch-btn:active:not(:disabled) {
    transform: scale(0.98);
}

#launch-btn:disabled {
    background: #444;
    color: #888;

    cursor: not-allowed;
}

/* =========================
   로그
========================= */

#log-panel {
    position: absolute;

    left: 15px;
    bottom: 15px;

    width: min(600px, calc(100% - 30px));

    max-height: 135px;

    padding: 10px;

    background: rgba(8,8,9,0.82);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 8px;

    backdrop-filter: blur(8px);

    overflow-y: auto;

    z-index: 20;

    font-family: monospace;
    font-size: 11px;

    color: #aaa;
}

.log-entry {
    margin-bottom: 4px;

    line-height: 1.4;
}

.log-entry:last-child {
    margin-bottom: 0;
}

.log-entry.success {
    color: #6cff55;
}

.log-entry.error {
    color: #ff5555;
}

.log-entry.info {
    color: #aaa;
}

/* =========================
   모바일
========================= */

@media (max-width: 800px) {

    #app {
        flex-direction: column;
    }

    #main {
        height: 55vh;
        flex: none;
    }

    #sidebar {
        width: 100%;
        min-width: 0;
        height: 45vh;

        border-left: none;
        border-top: 1px solid #29292d;

        padding: 14px;

        overflow-y: auto;
    }

    #log-panel {
        max-height: 95px;
    }

    #launch-btn {
        margin-top: 0;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =========================
         메인 화면
    ========================== -->

    <main id="main">

        <img
            id="gameImage"
            src="./images/minecraft-bg.jpg"
            alt="Minecraft"
        >

        <div id="imageOverlay"></div>

        <div id="centerContent">
            <h1>MojoCraft</h1>
            <p>
                Minecraft Java Edition Web Launcher
            </p>
        </div>

        <div id="image-indicators"></div>

        <div id="log-panel">

            <div class="log-entry info">
                [시스템] MojoCraft Launcher 시작
            </div>

        </div>

    </main>

    <!-- =========================
         사이드바
    ========================== -->

    <aside id="sidebar">

        <div class="logo">
            MojoCraft Web
        </div>

        <!-- 계정 -->

        <div class="account-card">

            <img
                id="avatar"
                class="avatar"
                alt="Minecraft Skin"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
            >

            <div class="user-info">

                <span
                    id="username"
                    class="username"
                >
                    비로그인
                </span>

                <span
                    id="auth-status"
                    class="status"
                >
                    Microsoft 계정 필요
                </span>

            </div>

        </div>

        <button
            id="login-btn"
            class="btn btn-login"
            onclick="startMicrosoftOAuth()"
        >
            Microsoft 계정 로그인
        </button>

        <!-- 버전 필터 -->

        <div class="version-box">

            <label for="version-type">
                버전 종류
            </label>

            <select
                id="version-type"
                onchange="filterVersions()"
            >
                <option value="release">
                    정식 출시 버전
                </option>

                <option value="snapshot">
                    스냅샷
                </option>

                <option value="all">
                    전체 버전
                </option>
            </select>

        </div>

        <!-- 검색 -->

        <div class="version-box">

            <label for="version-search">
                버전 검색
            </label>

            <input
                id="version-search"
                type="text"
                placeholder="예: 1.21.8"
                oninput="filterVersions()"
            >

        </div>

        <!-- 버전 선택 -->

        <div class="version-box">

            <label for="java-version">
                자바 마인크래프트 버전 선택
            </label>

            <select
                id="java-version"
                disabled
            >
                <option value="">
                    버전 불러오는 중...
                </option>
            </select>

        </div>

        <div
            id="version-status"
            class="info"
        >
            Minecraft 버전 목록을 불러오는 중...
        </div>

        <!-- 실행 -->

        <button
            id="launch-btn"
            disabled
            onclick="launchGameEngine()"
        >
            게임 실행
        </button>

    </aside>

</div>

<script>

/* =========================================================
   MojoCraft Launcher
========================================================= */

/*
 * Mojang 공식 version manifest
 *
 * 기존:
 * launchermeta.mojang.com
 *
 * 수정:
 * piston-meta.mojang.com
 */

const MOJANG_MANIFEST_URL =
    "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json";


/*
 * 현재 페이지에서 사용하는 이미지
 */

const IMAGES = [
    "./images/minecraft-bg.jpg",
    "./images/minecraft-2.jpeg",
    "./images/minecraft-3.jpeg",
    "./images/minecraft-4.jpeg",
    "./images/minecraft-5.jpeg"
];


/*
 * 상태
 */

let allVersions = [];

let selectedVersion = null;

let imageIndex = 0;

let imageTimer = null;


/* =========================================================
   로그
========================================================= */

function log(message, type = "info") {

    const panel =
        document.getElementById("log-panel");

    if (!panel) {
        return;
    }

    const entry =
        document.createElement("div");

    entry.className =
        `log-entry ${type}`;

    const time =
        new Date().toLocaleTimeString();

    entry.textContent =
        `[${time}] ${message}`;

    panel.appendChild(entry);

    panel.scrollTop =
        panel.scrollHeight;
}


/* =========================================================
   버전 상태 표시
========================================================= */

function setVersionStatus(
    message,
    type = "info"
) {

    const element =
        document.getElementById("version-status");

    if (!element) {
        return;
    }

    element.textContent =
        message;

    element.className =
        `info ${type}`;
}


/* =========================================================
   이미지 인디케이터
========================================================= */

function createImageIndicators() {

    const container =
        document.getElementById(
            "image-indicators"
        );

    container.innerHTML = "";

    IMAGES.forEach(
        (image, index) => {

            const button =
                document.createElement("button");

            button.className =
                "image-indicator";

            if (index === imageIndex) {
                button.classList.add("active");
            }

            button.type = "button";

            button.title =
                `배경 이미지 ${index + 1}`;

            button.addEventListener(
                "click",
                () => {

                    showImage(index);

                    restartImageTimer();

                }
            );

            container.appendChild(button);

        }
    );
}


/* =========================================================
   이미지 변경
========================================================= */

function showImage(index) {

    imageIndex =
        (index + IMAGES.length) %
        IMAGES.length;

    const image =
        document.getElementById(
            "gameImage"
        );

    image.style.opacity = "0";

    setTimeout(
        () => {

            image.src =
                IMAGES[imageIndex];

            image.onload =
                () => {

                    image.style.opacity = "1";

                };

            image.onerror =
                () => {

                    image.style.opacity = "1";

                    log(
                        `이미지를 불러오지 못했습니다: ${IMAGES[imageIndex]}`,
                        "error"
                    );

                };

        },
        250
    );

    updateImageIndicators();
}


/* =========================================================
   인디케이터 갱신
========================================================= */

function updateImageIndicators() {

    const buttons =
        document.querySelectorAll(
            ".image-indicator"
        );

    buttons.forEach(
        (button, index) => {

            button.classList.toggle(
                "active",
                index === imageIndex
            );

        }
    );
}


/* =========================================================
   이미지 자동 순환
========================================================= */

function startImageTimer() {

    clearInterval(imageTimer);

    imageTimer =
        setInterval(
            () => {

                showImage(
                    imageIndex + 1
                );

            },
            15000
        );
}


function restartImageTimer() {

    startImageTimer();

}


/* =========================================================
   버전 Manifest 불러오기
========================================================= */

async function fetchVersionManifest() {

    const select =
        document.getElementById(
            "java-version"
        );

    select.disabled = true;

    select.innerHTML =
        `<option value="">
            버전 불러오는 중...
        </option>`;

    setVersionStatus(
        "Mojang 버전 manifest를 불러오는 중..."
    );

    log(
        "Minecraft Java Edition 버전 목록 요청 시작...",
        "info"
    );

    try {

        const response =
            await fetch(
                MOJANG_MANIFEST_URL,
                {
                    method: "GET",

                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const data =
            await response.json();

        if (
            !data ||
            !Array.isArray(data.versions)
        ) {

            throw new Error(
                "manifest의 versions 배열을 찾을 수 없습니다."
            );

        }

        allVersions =
            data.versions;

        log(
            `성공: ${allVersions.length}개의 Minecraft 버전을 받았습니다.`,
            "success"
        );

        setVersionStatus(
            `버전 ${allVersions.length}개 로딩 완료`,
            "success"
        );

        filterVersions();

    }
    catch (error) {

        console.error(
            "Minecraft version manifest error:",
            error
        );

        log(
            `버전 로딩 실패: ${error.message}`,
            "error"
        );

        setVersionStatus(
            `버전 로딩 실패: ${error.message}`,
            "error"
        );

        select.disabled = true;

        select.innerHTML =
            `<option value="">
                버전 로딩 실패
            </option>`;

    }
}


/* =========================================================
   버전 필터
========================================================= */

function filterVersions() {

    const select =
        document.getElementById(
            "java-version"
        );

    const type =
        document.getElementById(
            "version-type"
        ).value;

    const search =
        document.getElementById(
            "version-search"
        ).value
        .trim()
        .toLowerCase();

    select.innerHTML = "";

    let filtered =
        allVersions.filter(
            version => {

                const typeMatch =
                    type === "all" ||
                    version.type === type;

                const searchMatch =
                    !search ||
                    version.id
                        .toLowerCase()
                        .includes(search);

                return (
                    typeMatch &&
                    searchMatch
                );

            }
        );

    /*
     * manifest는 최신 버전부터 오는 경우가
     * 대부분이지만, 확실하게 날짜순으로 정렬.
     */

    filtered.sort(
        (a, b) => {

            const dateA =
                new Date(
                    a.releaseTime || 0
                ).getTime();

            const dateB =
                new Date(
                    b.releaseTime || 0
                ).getTime();

            return dateB - dateA;

        }
    );

    if (filtered.length === 0) {

        const option =
            document.createElement(
                "option"
            );

        option.value = "";

        option.textContent =
            "조건에 맞는 버전 없음";

        select.appendChild(
            option
        );

        select.disabled = true;

        selectedVersion = null;

        document.getElementById(
            "launch-btn"
        ).disabled = true;

        return;

    }

    filtered.forEach(
        version => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                version.id;

            option.textContent =
                `${version.id} (${version.type})`;

            /*
             * 중요:
             *
             * JSON URL을 직접 만들지 않고
             * Mojang manifest가 제공한 URL을
             * 그대로 사용한다.
             */

            option.dataset.jsonUrl =
                version.url || "";

            option.dataset.releaseTime =
                version.releaseTime || "";

            select.appendChild(
                option
            );

        }
    );

    select.disabled = false;

    selectedVersion =
        filtered[0];

    select.value =
        filtered[0].id;

    document.getElementById(
        "launch-btn"
    ).disabled = false;

}


/* =========================================================
   버전 선택 변경
========================================================= */

document
    .getElementById("java-version")
    .addEventListener(
        "change",
        () => {

            const select =
                document.getElementById(
                    "java-version"
                );

            const selected =
                allVersions.find(
                    version =>
                        version.id ===
                        select.value
                );

            selectedVersion =
                selected || null;

        }
    );


/* =========================================================
   Microsoft 로그인
========================================================= */

/*
 * 주의:
 *
 * 실제 Microsoft 인증에는
 * Azure에서 발급받은 Client ID와
 * 서버 측 token exchange가 필요하다.
 *
 * 현재는 UI만 준비한다.
 */

function startMicrosoftOAuth() {

    log(
        "Microsoft 로그인 기능은 OAuth 서버 연결이 필요합니다.",
        "info"
    );

    alert(
        "Microsoft 계정 로그인 기능을 사용하려면\n" +
        "Azure OAuth Client ID와 인증 서버 설정이 필요합니다."
    );

}


/* =========================================================
   게임 실행
========================================================= */

function launchGameEngine() {

    const select =
        document.getElementById(
            "java-version"
        );

    const version =
        select.value;

    const option =
        select.options[
            select.selectedIndex
        ];

    if (!version || !option) {

        log(
            "Minecraft 버전을 먼저 선택해주세요.",
            "error"
        );

        return;

    }

    const jsonUrl =
        option.dataset.jsonUrl;

    if (!jsonUrl) {

        log(
            "선택한 버전에 대한 version JSON URL이 없습니다.",
            "error"
        );

        return;

    }

    /*
     * 실제 게임 실행 단계는
     * mainpage.html에서 담당한다.
     */

    const params =
        new URLSearchParams();

    params.set(
        "version",
        version
    );

    params.set(
        "json",
        jsonUrl
    );

    params.set(
        "username",
        "Player"
    );

    params.set(
        "uuid",
        "00000000000000000000000000000000"
    );

    log(
        `${version} 실행 준비 중...`,
        "success"
    );

    window.location.href =
        `./mainpage.html?${params.toString()}`;

}


/* =========================================================
   초기화
========================================================= */

async function initialize() {

    log(
        "MojoCraft Launcher 초기화...",
        "info"
    );

    createImageIndicators();

    showImage(0);

    startImageTimer();

    await fetchVersionManifest();

}


/* =========================================================
   시작
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    initialize
);

</script>

</body>
</html>
