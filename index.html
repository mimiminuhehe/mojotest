<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MojoCraft Web</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
        }

        body {
            display: flex;
        }

        /* =========================
           전체 레이아웃
        ========================= */

        #app {
            width: 100%;
            height: 100vh;
            display: flex;
            background: #111;
        }

        /* =========================
           게임 화면
        ========================= */

        #main {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #111;
        }

        #screen-container {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: #111;
        }

        #gameImage {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            /* 사진 전환을 부드럽게 */
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        #gameImage.fade-out {
            opacity: 0;
        }

        /* 십자선 없음 */
        /* 화면 위에 별도의 글씨나 오버레이 없음 */

        /* =========================
           로딩
        ========================= */

        #loading {
            position: absolute;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.65);

            z-index: 10;
        }

        #loading.active {
            display: flex;
        }

        .loading-box {
            width: min(420px, 85%);
            padding: 24px;

            background: rgba(20, 20, 20, 0.95);

            border-radius: 12px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .loading-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .progress-background {
            width: 100%;
            height: 8px;

            background: #333;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background: #4caf50;

            transition: width 0.2s ease;
        }

        #progress-text {
            margin-top: 10px;

            font-size: 13px;
            color: #aaa;

            text-align: right;
        }

        /* =========================
           로그
        ========================= */

        #log-panel {
            height: 120px;

            padding: 10px 14px;

            background: #0c0c0c;

            border-top: 1px solid #292929;

            overflow-y: auto;

            font-family: monospace;
            font-size: 12px;

            color: #aaa;
        }

        .log-line {
            margin-bottom: 4px;
        }

        .log-success {
            color: #75d175;
        }

        .log-error {
            color: #ff7373;
        }

        .log-info {
            color: #80bfff;
        }

        /* =========================
           오른쪽 사이드바
        ========================= */

        #sidebar {
            width: 320px;
            height: 100%;

            flex-shrink: 0;

            background: #181818;

            border-left: 1px solid #303030;

            display: flex;
            flex-direction: column;

            overflow-y: auto;
        }

        .sidebar-header {
            padding: 22px 20px 16px;

            border-bottom: 1px solid #303030;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;

            color: #fff;

            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 5px;

            color: #888;

            font-size: 12px;
        }

        /* =========================
           계정
        ========================= */

        .account-section {
            padding: 16px;
        }

        .account-card {
            display: flex;
            align-items: center;

            padding: 12px;

            background: #222;

            border: 1px solid #333;

            border-radius: 10px;

            margin-bottom: 10px;
        }

        .account-avatar {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #333;

            border-radius: 8px;

            font-size: 21px;

            margin-right: 10px;
        }

        .account-info {
            flex: 1;
            min-width: 0;
        }

        .account-name {
            font-size: 14px;
            font-weight: bold;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-status {
            margin-top: 4px;

            color: #777;

            font-size: 11px;
        }

        /* =========================
           버튼
        ========================= */

        button {
            width: 100%;

            border: 0;

            border-radius: 8px;

            padding: 12px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.15s ease;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            transform: scale(0.98);
        }

        #login-button {
            background: #2b2b2b;

            color: #fff;

            border: 1px solid #444;
        }

        #launch-button {
            background: #4caf50;

            color: #fff;

            font-size: 16px;

            padding: 14px;

            margin-top: 14px;
        }

        #launch-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           버전
        ========================= */

        .version-section {
            padding: 0 16px 16px;
        }

        .section-title {
            font-size: 12px;

            color: #888;

            margin-bottom: 8px;

            text-transform: uppercase;
        }

        .version-filter {
            display: flex;

            gap: 6px;

            margin-bottom: 10px;
        }

        .filter-button {
            flex: 1;

            padding: 8px 4px;

            background: #242424;

            color: #aaa;

            border: 1px solid #333;

            font-size: 11px;
        }

        .filter-button.active {
            background: #3b3b3b;

            color: #fff;

            border-color: #555;
        }

        #version-search {
            width: 100%;

            padding: 10px 11px;

            border-radius: 7px;

            border: 1px solid #383838;

            background: #222;

            color: #fff;

            outline: none;

            margin-bottom: 10px;
        }

        #version-search:focus {
            border-color: #555;
        }

        #version-list {
            max-height: 300px;

            overflow-y: auto;

            border: 1px solid #2d2d2d;

            border-radius: 8px;

            background: #202020;
        }

        .version-item {
            padding: 10px 11px;

            border-bottom: 1px solid #2d2d2d;

            cursor: pointer;

            transition: background 0.15s;
        }

        .version-item:last-child {
            border-bottom: 0;
        }

        .version-item:hover {
            background: #2b2b2b;
        }

        .version-item.selected {
            background: #343434;

            box-shadow: inset 3px 0 0 #4caf50;
        }

        .version-name {
            font-size: 13px;
            font-weight: bold;
        }

        .version-type {
            margin-top: 3px;

            color: #777;

            font-size: 10px;
        }

        /* =========================
           실행 영역
        ========================= */

        .launch-section {
            padding: 0 16px 20px;

            margin-top: auto;
        }

        #selected-version {
            margin-bottom: 7px;

            font-size: 12px;

            color: #888;

            text-align: center;
        }

        /* =========================
           모바일
        ========================= */

        @media (max-width: 800px) {

            #app {
                flex-direction: column;
            }

            #main {
                height: 55vh;
                flex: none;
            }

            #sidebar {
                width: 100%;
                height: 45vh;

                border-left: 0;
                border-top: 1px solid #303030;
            }

            #log-panel {
                height: 80px;
            }

            .sidebar-header {
                padding: 14px 16px 10px;
            }

            .account-section {
                padding: 10px 16px;
            }

            .version-section {
                padding-bottom: 10px;
            }

            .launch-section {
                padding-bottom: 14px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- =========================
         메인 화면
    ========================= -->

    <main id="main">

        <section id="screen-container">

            <!--
                사진은 이곳에 표시됨.
                십자선 없음.
                화면 위 글씨 없음.
            -->
            <img
                id="gameImage"
                src="./images/minecraft-bg.jpg"
                alt="Minecraft"
            >

            <!-- 로딩할 때만 나타남 -->
            <div id="loading">

                <div class="loading-box">

                    <div class="loading-title">
                        Minecraft 실행 준비 중...
                    </div>

                    <div class="progress-background">
                        <div
                            id="progress-bar"
                            class="progress-bar"
                        ></div>
                    </div>

                    <div id="progress-text">
                        0%
                    </div>

                </div>

            </div>

        </section>

        <section id="log-panel"></section>

    </main>


    <!-- =========================
         오른쪽 사이드바
    ========================= -->

    <aside id="sidebar">

        <header class="sidebar-header">

            <div class="logo">
                MojoCraft
            </div>

            <div class="subtitle">
                Web Minecraft Launcher
            </div>

        </header>


        <!-- 계정 -->

        <section class="account-section">

            <div class="account-card">

                <div class="account-avatar">
                    ⛏️
                </div>

                <div class="account-info">

                    <div
                        id="account-name"
                        class="account-name"
                    >
                        로그인 필요
                    </div>

                    <div
                        id="account-status"
                        class="account-status"
                    >
                        Microsoft 계정
                    </div>

                </div>

            </div>

            <button id="login-button">
                Microsoft 로그인
            </button>

        </section>


        <!-- 버전 -->

        <section class="version-section">

            <div class="section-title">
                Minecraft 버전
            </div>

            <div class="version-filter">

                <button
                    class="filter-button active"
                    data-filter="release"
                >
                    Release
                </button>

                <button
                    class="filter-button"
                    data-filter="snapshot"
                >
                    Snapshot
                </button>

                <button
                    class="filter-button"
                    data-filter="all"
                >
                    전체
                </button>

            </div>

            <input
                id="version-search"
                type="text"
                placeholder="버전 검색..."
            >

            <div id="version-list"></div>

        </section>


        <!-- 실행 -->

        <section class="launch-section">

            <div id="selected-version">
                버전을 선택하세요
            </div>

            <button
                id="launch-button"
                disabled
            >
                게임 실행
            </button>

        </section>

    </aside>

</div>


<script>
    /* =========================================================
       설정
    ========================================================= */

    const CLIENT_ID = "YOUR_MICROSOFT_CLIENT_ID";

    const MOJANG_MANIFEST_URL =
        "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json";


    /* =========================================================
       Minecraft 배경 이미지
       
       총 5장
       
       1. 기존 이미지
       2~5. 새로 추가한 이미지
    ========================================================= */

    const backgroundImages = [

        "./images/minecraft-bg.jpg",

        "./images/minecraft-2.jpeg",

        "./images/minecraft-3.jpeg",

        "./images/minecraft-4.jpeg",

        "./images/minecraft-5.jpeg"

    ];


    let currentImageIndex = 0;


    /* =========================================================
       15초마다 다음 사진으로 변경
       
       1 → 2 → 3 → 4 → 5 → 1 ...
    ========================================================= */

    function changeBackgroundImage() {

        const image = document.getElementById("gameImage");

        if (!image) {
            return;
        }

        /*
            먼저 투명하게 만들어서
            사진이 자연스럽게 바뀌도록 함
        */

        image.classList.add("fade-out");


        setTimeout(() => {

            currentImageIndex++;

            /*
                5번째 다음에는 다시 1번째
            */

            if (
                currentImageIndex >= backgroundImages.length
            ) {
                currentImageIndex = 0;
            }


            image.src =
                backgroundImages[currentImageIndex];


            /*
                이미지가 로딩된 후 다시 표시
            */

            image.onload = () => {

                image.classList.remove("fade-out");

            };

        }, 800);
    }


    /*
        15초마다 실행
    */

    setInterval(
        changeBackgroundImage,
        15000
    );


    /* =========================================================
       DOM
    ========================================================= */

    const versionList =
        document.getElementById("version-list");

    const versionSearch =
        document.getElementById("version-search");

    const launchButton =
        document.getElementById("launch-button");

    const loginButton =
        document.getElementById("login-button");

    const loading =
        document.getElementById("loading");

    const progressBar =
        document.getElementById("progress-bar");

    const progressText =
        document.getElementById("progress-text");

    const selectedVersionText =
        document.getElementById("selected-version");

    const logPanel =
        document.getElementById("log-panel");


    /* =========================================================
       상태
    ========================================================= */

    let versions = [];

    let currentFilter = "release";

    let selectedVersion = null;


    /* =========================================================
       로그
    ========================================================= */

    function addLog(
        message,
        type = "normal"
    ) {

        const line =
            document.createElement("div");

        line.className =
            "log-line";


        if (type === "success") {

            line.classList.add(
                "log-success"
            );

        }

        if (type === "error") {

            line.classList.add(
                "log-error"
            );

        }

        if (type === "info") {

            line.classList.add(
                "log-info"
            );

        }


        const time =
            new Date().toLocaleTimeString();


        line.textContent =
            `[${time}] ${message}`;


        logPanel.appendChild(line);


        logPanel.scrollTop =
            logPanel.scrollHeight;

    }


    /* =========================================================
       기본 버전
       
       Mojang API를 불러오지 못했을 때 사용
    ========================================================= */

    const fallbackVersions = [

        {
            id: "1.21.8",
            type: "release"
        },

        {
            id: "1.21.7",
            type: "release"
        },

        {
            id: "1.21.6",
            type: "release"
        },

        {
            id: "1.21.5",
            type: "release"
        },

        {
            id: "1.21.4",
            type: "release"
        },

        {
            id: "1.21.3",
            type: "release"
        },

        {
            id: "1.21.2",
            type: "release"
        },

        {
            id: "1.21.1",
            type: "release"
        },

        {
            id: "1.21",
            type: "release"
        },

        {
            id: "1.20.6",
            type: "release"
        },

        {
            id: "1.20.4",
            type: "release"
        },

        {
            id: "1.20.2",
            type: "release"
        },

        {
            id: "1.20.1",
            type: "release"
        },

        {
            id: "1.19.4",
            type: "release"
        },

        {
            id: "1.19.3",
            type: "release"
        },

        {
            id: "1.18.2",
            type: "release"
        },

        {
            id: "1.17.1",
            type: "release"
        },

        {
            id: "1.16.5",
            type: "release"
        },

        {
            id: "1.12.2",
            type: "release"
        },

        {
            id: "1.8.9",
            type: "release"
        }

    ];


    /* =========================================================
       Mojang 버전 목록 가져오기
    ========================================================= */

    async function loadVersions() {

        addLog(
            "Minecraft 버전 목록을 불러오는 중...",
            "info"
        );


        try {

            const response =
                await fetch(
                    MOJANG_MANIFEST_URL
                );


            if (!response.ok) {

                throw new Error(
                    "버전 목록 요청 실패"
                );

            }


            const data =
                await response.json();


            if (
                !data ||
                !Array.isArray(data.versions)
            ) {

                throw new Error(
                    "잘못된 버전 데이터"
                );

            }


            versions =
                data.versions.map(
                    version => ({

                        id: version.id,

                        type: version.type,

                        url: version.url,

                        time: version.time,

                        releaseTime:
                            version.releaseTime

                    })
                );


            addLog(
                `${versions.length}개의 Minecraft 버전을 불러왔습니다.`,
                "success"
            );


        } catch (error) {

            console.error(error);


            versions =
                fallbackVersions;


            addLog(
                "버전 목록을 가져오지 못했습니다. 기본 목록을 사용합니다.",
                "error"
            );

        }


        renderVersions();

    }


    /* =========================================================
       버전 표시
    ========================================================= */

    function renderVersions() {

        versionList.innerHTML = "";


        const searchText =
            versionSearch.value
                .trim()
                .toLowerCase();


        const filteredVersions =
            versions.filter(
                version => {

                    /*
                        타입 필터
                    */

                    if (
                        currentFilter !== "all" &&
                        version.type !== currentFilter
                    ) {

                        return false;

                    }


                    /*
                        검색 필터
                    */

                    if (
                        searchText &&
                        !version.id
                            .toLowerCase()
                            .includes(searchText)
                    ) {

                        return false;

                    }


                    return true;

                }
            );


        if (
            filteredVersions.length === 0
        ) {

            const empty =
                document.createElement("div");


            empty.style.padding =
                "15px";


            empty.style.textAlign =
                "center";


            empty.style.color =
                "#777";


            empty.textContent =
                "버전이 없습니다.";


            versionList.appendChild(
                empty
            );


            return;

        }


        filteredVersions.forEach(
            version => {

                const item =
                    document.createElement("div");


                item.className =
                    "version-item";


                if (
                    selectedVersion &&
                    selectedVersion.id === version.id
                ) {

                    item.classList.add(
                        "selected"
                    );

                }


                const name =
                    document.createElement("div");


                name.className =
                    "version-name";


                name.textContent =
                    version.id;


                const type =
                    document.createElement("div");


                type.className =
                    "version-type";


                type.textContent =
                    version.type === "release"
                        ? "Release"
                        : "Snapshot";


                item.appendChild(name);

                item.appendChild(type);


                item.addEventListener(
                    "click",
                    () => {

                        selectVersion(
                            version
                        );

                    }
                );


                versionList.appendChild(
                    item
                );

            }
        );

    }


    /* =========================================================
       버전 선택
    ========================================================= */

    function selectVersion(
        version
    ) {

        selectedVersion =
            version;


        selectedVersionText.textContent =
            `선택됨: ${version.id}`;


        launchButton.disabled =
            false;


        renderVersions();


        addLog(
            `Minecraft ${version.id} 선택`,
            "info"
        );

    }


    /* =========================================================
       필터 버튼
    ========================================================= */

    document
        .querySelectorAll(".filter-button")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".filter-button"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    currentFilter =
                        button.dataset.filter;


                    renderVersions();

                }
            );

        });


    /* =========================================================
       검색
    ========================================================= */

    versionSearch.addEventListener(
        "input",
        () => {

            renderVersions();

        }
    );


    /* =========================================================
       Microsoft 로그인
       
       실제 인증 연결 전의 기본 구조
    ========================================================= */

    loginButton.addEventListener(
        "click",
        () => {

            addLog(
                "Microsoft 로그인 버튼을 눌렀습니다.",
                "info"
            );


            if (
                CLIENT_ID ===
                "YOUR_MICROSOFT_CLIENT_ID"
            ) {

                alert(
                    "Microsoft OAuth Client ID를 설정해야 합니다."
                );


                addLog(
                    "Microsoft Client ID가 설정되지 않았습니다.",
                    "error"
                );


                return;

            }


            /*
                실제 Microsoft OAuth는
                Authorization Code + PKCE 방식으로
                연결해야 합니다.
            */

            addLog(
                "Microsoft 인증을 시작합니다...",
                "info"
            );

        }
    );


    /* =========================================================
       게임 실행
    ========================================================= */

    launchButton.addEventListener(
        "click",
        async () => {

            if (!selectedVersion) {

                alert(
                    "Minecraft 버전을 먼저 선택하세요."
                );

                return;

            }


            addLog(
                `Minecraft ${selectedVersion.id} 실행 준비...`,
                "info"
            );


            loading.classList.add(
                "active"
            );


            launchButton.disabled =
                true;


            let progress = 0;


            progressBar.style.width =
                "0%";


            progressText.textContent =
                "0%";


            /*
                현재는 UI 테스트용 진행률입니다.
                실제 Java Minecraft 실행은
                아직 연결하지 않은 상태입니다.
            */

            while (progress < 100) {

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            80
                        )
                );


                progress += 2;


                if (progress > 100) {
                    progress = 100;
                }


                progressBar.style.width =
                    `${progress}%`;


                progressText.textContent =
                    `${progress}%`;

            }


            addLog(
                `Minecraft ${selectedVersion.id} 실행 준비 완료`,
                "success"
            );


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );


            loading.classList.remove(
                "active"
            );


            launchButton.disabled =
                false;


            addLog(
                "현재 버전에서는 실제 Minecraft Java 실행 엔진이 연결되지 않았습니다.",
                "info"
            );

        }
    );


    /* =========================================================
       시작
    ========================================================= */

    addLog(
        "MojoCraft Web Launcher 시작",
        "success"
    );


    addLog(
        "배경 이미지 5장을 15초마다 자동으로 변경합니다.",
        "info"
    );


    loadVersions();

</script>
