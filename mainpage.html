<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoCraft Core Engine & Runtime</title>

<!-- WebAssembly 기반 JVM (CheerpJ v3) 로더 -->
<script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #0e0e10;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 24px;
    font-weight: 800;
}

.back-btn {
    border: 1px solid #3b3b40;
    background: #222226;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
}

.back-btn:hover { background: #2c2c31; }

#game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: #000;
    border: 2px solid #333;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#cheerpjDisplay {
    width: 100% !important;
    height: 100% !important;
}

.game-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    z-index: 10;
}

.progress-text {
    font-size: 18px;
    font-weight: bold;
    color: #76ff03;
}

.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.action-btn {
    padding: 14px;
    border: 1px solid #3b3b40;
    border-radius: 8px;
    background: #252529;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}

.action-btn:hover:not(:disabled) { background: #303035; }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-launch {
    background: #76ff03;
    color: #000;
    font-size: 16px;
}
.btn-launch:hover:not(:disabled) { background: #8cff35; }

.log-card {
    background: #0d0d0f;
    border: 1px solid #29292e;
    border-radius: 10px;
    overflow: hidden;
}

.log-header {
    padding: 10px 14px;
    background: #18181b;
    border-bottom: 1px solid #29292e;
    font-weight: 700;
    font-size: 13px;
}

#log {
    height: 180px;
    padding: 12px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
}

.log { margin-bottom: 4px; line-height: 1.4; }
.log.info { color: #aaa; }
.log.success { color: #6cff55; }
.log.error { color: #ff5555; }
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div>
            <div class="title">MojoCraft Web Engine</div>
            <div style="font-size: 12px; color: #888;">Minecraft Java Edition Web Engine</div>
        </div>
        <button class="back-btn" onclick="goBack()">← 런처로 돌아가기</button>
    </header>

    <div id="game-container">
        <div id="game-overlay" class="game-overlay">
            <div id="overlay-status" class="progress-text">버튼을 눌러 리소스를 다운로드하세요.</div>
        </div>
        <div id="cheerpjDisplay"></div>
    </div>

    <section class="actions">
        <button id="prep-btn" class="action-btn" onclick="prepareFiles()">1. 리소스 직접 다운로드</button>
        <button id="launch-btn" class="action-btn btn-launch" onclick="launchJavaMinecraft()" disabled>2. 게임 실행</button>
    </section>

    <section class="log-card">
        <div class="log-header">Engine Log</div>
        <div id="log"></div>
    </section>

</div>

<script>
const launchParams = new URLSearchParams(window.location.search);
const LAUNCH_VERSION = launchParams.get("version") || "1.12.2";
const LAUNCH_JSON_URL = launchParams.get("json");

let currentVersionData = null;
let isReadyToLaunch = false;

function log(message, type = "info") {
    const element = document.getElementById("log");
    const line = document.createElement("div");
    line.className = `log ${type}`;
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${message}`;
    element.appendChild(line);
    element.scrollTop = element.scrollHeight;
}

function updateOverlay(text, show = true) {
    const overlay = document.getElementById("game-overlay");
    const status = document.getElementById("overlay-status");
    status.textContent = text;
    overlay.style.display = show ? "flex" : "none";
}

/* =========================================================
   1. Mojang 서버에서 직접 다운로드 (프록시 제거)
========================================================= */
async function prepareFiles() {
    log(`[시스템] ${LAUNCH_VERSION} 리소스 직접 다운로드를 시작합니다.`, "info");
    updateOverlay("버전 메타데이터 다운로드 중...");

    try {
        let versionJsonUrl = LAUNCH_JSON_URL;

        // 전달받은 JSON URL이 없다면 Mojang 공식 Manifest에서 검색
        if (!versionJsonUrl) {
            log("Mojang 공식 Manifest 검색 중...", "info");
            const manifestUrl = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json";
            
            const manifestRes = await fetch(manifestUrl);
            if (!manifestRes.ok) throw new Error(`Manifest 요청 실패 (HTTP ${manifestRes.status})`);
            
            const manifestData = await manifestRes.json();
            const versionObj = manifestData.versions.find(v => v.id === LAUNCH_VERSION);
            
            if (!versionObj) throw new Error(`${LAUNCH_VERSION} 버전을 Manifest에서 찾지 못했습니다.`);
            versionJsonUrl = versionObj.url;
        }

        // 1. Mojang 서버에서 version.json 직접 수신
        log(`Version JSON 직접 요청: ${versionJsonUrl}`, "info");
        const versionRes = await fetch(versionJsonUrl);
        if (!versionRes.ok) throw new Error(`Version JSON 요청 실패 (HTTP ${versionRes.status})`);
        
        currentVersionData = await versionRes.json();
        log("Version.json 읽기 완료!", "success");

        updateOverlay("Client JAR 다운로드 중...");
        
        // 2. Client JAR URL 확인
        const clientJarUrl = currentVersionData.downloads?.client?.url;
        if (!clientJarUrl) throw new Error("Client JAR 다운로드 링크가 없습니다.");

        // 3. Mojang 서버에서 Client JAR 바이너리 직접 수신
        log(`Client JAR 직접 요청 중...`, "info");
        const jarRes = await fetch(clientJarUrl);
        if (!jarRes.ok) throw new Error(`Client JAR 다운로드 실패 (HTTP ${jarRes.status})`);

        const jarData = await jarRes.arrayBuffer();
        
        // 4. Cache Storage에 저장
        if ('caches' in window) {
            const cache = await caches.open("mojocraft-runtime");
            const responseToCache = new Response(jarData, {
                headers: { 'Content-Type': 'application/java-archive' }
            });
            await cache.put('/app/minecraft.jar', responseToCache);
            log("Cache Storage에 Client JAR 저장 완료!", "success");
        }

        log(`Client JAR 준비 성공 (${(jarData.byteLength / 1024 / 1024).toFixed(1)} MB)`, "success");

        updateOverlay("파일 준비 완료! '게임 실행' 버튼을 누르세요.", true);
        document.getElementById("launch-btn").disabled = false;
        isReadyToLaunch = true;

    } catch (err) {
        log(`[에러] ${err.message}`, "error");
        updateOverlay(`준비 실패: ${err.message}`);
    }
}

/* =========================================================
   2. CheerpJ JVM 구동
========================================================= */
async function launchJavaMinecraft() {
    if (!isReadyToLaunch) return;

    log("CheerpJ JVM 초기화 시작...", "info");
    updateOverlay("CheerpJ 자바 엔진 초기화 중...");

    try {
        await cheerpjInit({
            displayContainer: document.getElementById("cheerpjDisplay")
        });

        log("JVM 초기화 완료! 마인크래프트 실행 중...", "success");
        updateOverlay("", false);

        await cheerpjRunLibrary("/app/minecraft.jar");

    } catch (error) {
        log(`Java 실행 실패: ${error.message}`, "error");
        updateOverlay("게임 실행 에러 발생!");
    }
}

function goBack() {
    window.location.href = "./index.html";
}

window.addEventListener("DOMContentLoaded", () => {
    log(`MojoCraft Engine 로드 완료 - 버전: ${LAUNCH_VERSION}`, "info");
});
</script>
</body>
</html>
