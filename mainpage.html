<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoCraft Core Engine & Runtime</title>

<!-- WebAssembly 기반 JVM (CheerpJ) 스크립트 로드 -->
<script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #0e0e10;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

/* 헤더 & 정보 */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 24px;
    font-weight: 800;
}

.back-btn {
    border: 1px solid #3b3b40;
    background: #222226;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
}

.back-btn:hover { background: #2c2c31; }

/* 게임 화면 영역 (Canvas Container) */
#game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: #000;
    border: 2px solid #333;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 렌더링용 Canvas */
#cheerpjDisplay {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
}

/* 게임 플레이 오버레이 */
.game-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    z-index: 10;
}

.progress-text {
    font-size: 18px;
    font-weight: bold;
    color: #76ff03;
}

/* 실행 및 다운로드 버튼 */
.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.action-btn {
    padding: 14px;
    border: 1px solid #3b3b40;
    border-radius: 8px;
    background: #252529;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}

.action-btn:hover:not(:disabled) { background: #303035; }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-launch {
    background: #76ff03;
    color: #000;
    font-size: 16px;
}
.btn-launch:hover:not(:disabled) { background: #8cff35; }

/* 로그 패널 */
.log-card {
    background: #0d0d0f;
    border: 1px solid #29292e;
    border-radius: 10px;
    overflow: hidden;
}

.log-header {
    padding: 10px 14px;
    background: #18181b;
    border-bottom: 1px solid #29292e;
    font-weight: 700;
    font-size: 13px;
}

#log {
    height: 180px;
    padding: 12px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
}

.log { margin-bottom: 4px; line-height: 1.4; }
.log.info { color: #aaa; }
.log.success { color: #6cff55; }
.log.error { color: #ff5555; }
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div>
            <div class="title">MojoCraft Web Engine</div>
            <div style="font-size: 12px; color: #888;">Minecraft Java Edition Web Engine</div>
        </div>
        <button class="back-btn" onclick="goBack()">← 런처로 돌아가기</button>
    </header>

    <!-- 1. 게임 화면 (<canvas> 구동부) -->
    <div id="game-container">
        <div id="game-overlay" class="game-overlay">
            <div id="overlay-status" class="progress-text">버전 파일 및 자바 준비 중...</div>
        </div>
        <!-- CheerpJ가 게임 화면을 그릴 영역 -->
        <div id="cheerpjDisplay"></div>
    </div>

    <!-- 2. 다운로드 & 게임 시작 제어 버튼 -->
    <section class="actions">
        <button id="prep-btn" class="action-btn" onclick="prepareFiles()">1. 리소스 다운로드 준비</button>
        <button id="launch-btn" class="action-btn btn-launch" onclick="launchJavaMinecraft()" disabled>2. 게임 실행 (Java 구동)</button>
    </section>

    <!-- 3. 로그 창 -->
    <section class="log-card">
        <div class="log-header">Engine & Java Runtime Log</div>
        <div id="log"></div>
    </section>

</div>

<script>
/* =========================================================
   URL 및 상태값 파라미터
========================================================= */
const launchParams = new URLSearchParams(window.location.search);
const LAUNCH_VERSION = launchParams.get("version") || "1.12.2";
const LAUNCH_JSON_URL = launchParams.get("json");
const LAUNCH_USERNAME = launchParams.get("username") || "Player";

/* CORS 프록시 주소 (필요시 교체) */
const CORS_PROXY = "https://corsproxy.io/?";

let currentVersionData = null;
let isReadyToLaunch = false;

function log(message, type = "info") {
    const element = document.getElementById("log");
    const line = document.createElement("div");
    line.className = `log ${type}`;
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${message}`;
    element.appendChild(line);
    element.scrollTop = element.scrollHeight;
}

function updateOverlay(text, show = true) {
    const overlay = document.getElementById("game-overlay");
    const status = document.getElementById("overlay-status");
    status.textContent = text;
    overlay.style.display = show ? "flex" : "none";
}

/* =========================================================
   1. 파일 다운로드 파이프라인 (CORS 우회 적용)
========================================================= */
async function prepareFiles() {
    log(`[시스템] ${LAUNCH_VERSION} 리소스 받기를 시작합니다.`, "info");
    updateOverlay("버전 메타데이터 다운로드 중...");

    try {
        let jsonUrl = LAUNCH_JSON_URL;
        if (!jsonUrl) {
            jsonUrl = `https://piston-meta.mojang.com/mc/game/version_manifest_v2.json`;
        }

        // 프록시 적용 요청
        const targetUrl = CORS_PROXY + encodeURIComponent(jsonUrl);
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error("Manifest 요청 실패");
        
        currentVersionData = await response.json();
        log("Version.json 로드 성공", "success");

        updateOverlay("Client JAR 다운로드 중...");
        
        const clientJarUrl = currentVersionData.downloads?.client?.url;
        if (clientJarUrl) {
            const clientTarget = CORS_PROXY + encodeURIComponent(clientJarUrl);
            const jarRes = await fetch(clientTarget);
            const jarBlob = await jarRes.blob();
            log(`Client JAR 준비 완료 (${(jarBlob.size / 1024 / 1024).toFixed(1)} MB)`, "success");
        }

        updateOverlay("모든 파일 준비 완료! '게임 실행'을 누르세요.", true);
        document.getElementById("launch-btn").disabled = false;
        isReadyToLaunch = true;
        log("게임 실행 준비가 끝났습니다.", "success");

    } catch (err) {
        log(`에러 발생: ${err.message}`, "error");
        updateOverlay(`준비 실패: ${err.message}`);
    }
}

/* =========================================================
   2. CheerpJ (WebAssembly Java) 엔진으로 자바 실행
========================================================= */
async function launchJavaMinecraft() {
    if (!isReadyToLaunch) return;

    log("CheerpJ 자바가상머신(JVM) 초기화 중...", "info");
    updateOverlay("CheerpJ JVM 모듈 로딩 중...");

    try {
        // CheerpJ 가상 머신 초기화
        await cheerpjInit({
            displayContainer: document.getElementById("cheerpjDisplay")
        });

        log("JVM 초기화 성공! 게임 가동 시작...", "success");
        updateOverlay("", false); // 게임 화면 오버레이 제거

        /* 
         * 자바 마인크래프트 실행 Command 호출
         * CheerpJ를 사용해 자바 실행 파일(Main Class) 및 인수 전달
         */
        await cheerpjRunLibrary("/app/minecraft.jar"); 

    } catch (error) {
        log(`Java 실행 에러: ${error.message}`, "error");
        updateOverlay("게임 실행 실패!");
    }
}

function goBack() {
    window.location.href = "./index.html";
}

window.addEventListener("DOMContentLoaded", () => {
    log(`MojoCraft Core 시작 - 선택 버전: ${LAUNCH_VERSION}`, "info");
});
</script>
</body>
</html>
