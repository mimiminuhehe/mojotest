<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minecraft Web Launcher</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08090b;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    display: flex;
}

/* =========================
   메인 화면
========================= */

#main-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #000;
}

#screen-container {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    overflow: hidden;
}

/*
   Minecraft 실행 화면이 들어갈 영역
*/
#game-display {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#cheerpjDisplay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
}

/*
   중앙 로딩 UI
   ※ Mojocraft 글씨 없음
*/
#loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.loading-box {
    min-width: 300px;
    max-width: 500px;

    padding: 24px;

    background: rgba(0, 0, 0, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;

    text-align: center;
    backdrop-filter: blur(8px);
}

.loading-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 14px;
}

.loading-text {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 15px;
}

.progress-container {
    width: 100%;
    height: 7px;

    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

#progress-bar {
    width: 0%;
    height: 100%;

    background: #76ff03;

    transition: width 0.25s ease;
}

#progress-percent {
    margin-top: 9px;
    font-size: 12px;
    color: #aaa;
}

/* =========================
   로그
========================= */

#log-panel {
    height: 155px;
    flex-shrink: 0;

    background: #0c0d0f;
    border-top: 1px solid #25272b;

    padding: 10px;

    overflow-y: auto;

    font-family: Consolas, monospace;
    font-size: 12px;
}

.log-entry {
    margin-bottom: 5px;
    line-height: 1.4;
}

.log-entry.info {
    color: #aaa;
}

.log-entry.success {
    color: #4caf50;
}

.log-entry.error {
    color: #f44336;
}

.log-entry.warning {
    color: #ffc107;
}

/* =========================
   사이드바
========================= */

#sidebar {
    width: 320px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    gap: 15px;

    padding: 20px;

    background: #121316;
    border-left: 1px solid #292b30;

    overflow-y: auto;
}

/*
   기존 Mojocraft 로고 영역 제거
*/

.account-card {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 15px;

    background: #24262b;
    border-radius: 9px;
}

.avatar {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    object-fit: cover;

    background: #444;
    border-radius: 5px;
}

.user-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.username {
    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status {
    margin-top: 3px;

    font-size: 12px;
    color: #888;
}

/* =========================
   버튼
========================= */

button {
    width: 100%;

    padding: 12px;

    border: none;
    border-radius: 6px;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.1s ease;
}

button:active {
    transform: scale(0.98);
}

.btn-login {
    background: #0078d4;
    color: #fff;
}

.btn-login:hover {
    background: #0067b8;
}

.btn-launch {
    margin-top: auto;

    background: #76ff03;
    color: #000;

    font-size: 17px;
}

.btn-launch:hover {
    background: #64dd17;
}

.btn-launch:disabled {
    background: #444;
    color: #888;
    cursor: not-allowed;
}

/* =========================
   버전 선택
========================= */

.version-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.version-group label {
    font-size: 12px;
    color: #aaa;
}

.version-select-row {
    display: flex;
    gap: 7px;
}

select {
    width: 100%;

    padding: 10px;

    background: #24262b;
    color: #fff;

    border: 1px solid #3b3e44;
    border-radius: 5px;

    outline: none;
}

select:focus {
    border-color: #76ff03;
}

select:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* =========================
   상태 카드
========================= */

.status-card {
    padding: 13px;

    background: #1d1f23;
    border-radius: 7px;

    font-size: 12px;
}

.status-card-title {
    color: #aaa;
    margin-bottom: 5px;
}

#current-version {
    color: #fff;
    font-weight: 600;
    word-break: break-all;
}

#manifest-url {
    margin-top: 5px;

    color: #777;

    font-size: 10px;
    line-height: 1.4;

    word-break: break-all;
}

/* =========================
   모바일
========================= */

@media (max-width: 800px) {

    body {
        flex-direction: column;
        overflow: auto;
    }

    #main-content {
        min-height: 65vh;
    }

    #sidebar {
        width: 100%;
        min-height: 35vh;

        border-left: none;
        border-top: 1px solid #292b30;
    }

    .btn-launch {
        margin-top: 5px;
    }
}
</style>
</head>

<body>

<!-- =========================
     메인
========================= -->

        </div>

</div>


<!-- =========================
     오른쪽 사이드바
========================= -->

<div id="sidebar">

    <!-- 계정 -->
    <div class="account-card">

        <img
            id="avatar"
            class="avatar"
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
            alt="Skin"
        >

        <div class="user-info">

            <span
                class="username"
                id="username"
            >
                Player
            </span>

            <span
                class="status"
                id="auth-status"
            >
                로그인되지 않음
            </span>

        </div>

    </div>


    <!-- Microsoft 로그인 -->
    <button
        class="btn-login"
        id="login-btn"
        onclick="startMicrosoftOAuth()"
    >
        Microsoft 계정 로그인
    </button>


    <!-- 버전 선택 -->
    <div class="version-group">

        <label for="version-type">
            버전 종류
        </label>

        <select id="version-type">

            <option value="release">
                정식 Release
            </option>

            </option>

        </select>

    </div>


    <div class="version-group">

        <label for="java-version">
            Minecraft Java 버전
        </label>

        <select
            id="java-version"
            disabled
        >

            <option>
                버전 정보를 불러오는 중...
            </option>

        </select>

    </div>


    <!-- 현재 버전 정보 -->
    <div class="status-card">

        <div class="status-card-title">
            선택된 버전
        </div>

        <div id="current-version">
            -
        </div>

        <div id="manifest-url">
            -
        </div>

    </div>


    <!-- 실행 -->
    <button
        class="btn-launch"
        id="launch-btn"
        onclick="launchMinecraft()"
        disabled
    >
        Minecraft 실행
    </button>

</div>


<script>

/* =========================================================
   설정
========================================================= */

const VERSION_MANIFEST_URL =
    "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json";

const CACHE_NAME =
    "mojocraft-minecraft-files-v2";


/*
   실제 Microsoft OAuth를 사용할 경우
   Azure Portal에서 발급받은 Client ID를 넣어야 함.
*/
const CLIENT_ID =
    "";

const REDIRECT_URI =
    window.location.origin + window.location.pathname;


/* =========================================================
   상태
========================================================= */

let allVersions = [];

let currentVersion = null;

let currentVersionJson = null;

let authSession = {

    username: "Player",

    uuid: "00000000000000000000000000000000",

    minecraftToken: null

};


/* =========================================================
   DOM
========================================================= */

const versionType =
    document.getElementById("version-type");

const versionSelect =
    document.getElementById("java-version");

const launchButton =
    document.getElementById("launch-btn");

const currentVersionText =
    document.getElementById("current-version");

const manifestUrlText =
    document.getElementById("manifest-url");

const progressBar =
    document.getElementById("progress-bar");

const progressPercent =
    document.getElementById("progress-percent");

const loadingTitle =
    document.getElementById("loading-title");

const loadingText =
    document.getElementById("loading-text");

const loadingOverlay =
    document.getElementById("loading-overlay");


/* =========================================================
   로그
========================================================= */

function log(message, type = "info") {

    const panel =
        document.getElementById("log-panel");

    const entry =
        document.createElement("div");

    entry.className =
        "log-entry " + type;

    const time =
        new Date().toLocaleTimeString();

    entry.textContent =
        `[${time}] ${message}`;

    panel.appendChild(entry);

    panel.scrollTop =
        panel.scrollHeight;

}


/* =========================================================
   진행률
========================================================= */

function setProgress(percent, title, text) {

    const value =
        Math.max(0, Math.min(100, percent));

    progressBar.style.width =
        value + "%";

    progressPercent.textContent =
        Math.round(value) + "%";

    if (title) {

        loadingTitle.textContent =
            title;

    }

    if (text) {

        loadingText.textContent =
            text;

    }

}


/* =========================================================
   Cache Storage
========================================================= */

async function openMinecraftCache() {

    if (!("caches" in window)) {

        throw new Error(
            "이 브라우저는 Cache Storage를 지원하지 않습니다."
        );

    }

    return await caches.open(CACHE_NAME);

}


/* =========================================================
   스트리밍 다운로드
========================================================= */

async function downloadWithProgress(
    url,
    cacheKey,
    label,
    progressStart,
    progressEnd
) {

    const cache =
        await openMinecraftCache();

    const cached =
        await cache.match(cacheKey);

    if (cached) {

        log(
            `${label}: 캐시에서 불러왔습니다.`,
            "success"
        );

        setProgress(
            progressEnd,
            label,
            "캐시된 파일을 사용합니다."
        );

        return cached;

    }


    log(
        `${label}: 다운로드 시작`,
        "info"
    );


    const response =
        await fetch(url, {
            cache: "no-store"
        });


    if (!response.ok) {

        throw new Error(
            `${response.status} ${response.statusText}`
        );

    }


    const total =
        Number(
            response.headers.get(
                "content-length"
            )
        ) || 0;


    if (!response.body || !total) {

        const blob =
            await response.blob();

        const cachedResponse =
            new Response(blob, {
                headers: {
                    "Content-Type":
                        response.headers.get(
                            "content-type"
                        ) ||
                        "application/octet-stream"
                }
            });

        await cache.put(
            cacheKey,
            cachedResponse.clone()
        );

        setProgress(
            progressEnd,
            label,
            "다운로드 완료"
        );

        return cachedResponse;

    }


    const reader =
        response.body.getReader();

    const chunks = [];

    let received = 0;

    while (true) {

        const {
            done,
            value
        } =
            await reader.read();

        if (done) break;

        chunks.push(value);

        received += value.length;

        const ratio =
            received / total;

        const progress =
            progressStart +
            ratio *
            (progressEnd - progressStart);

        setProgress(
            progress,
            label,
            `${formatBytes(received)} / ${formatBytes(total)}`
        );

    }


    const blob =
        new Blob(chunks);

    const cachedResponse =
        new Response(blob, {
            headers: {
                "Content-Type":
                    response.headers.get(
                        "content-type"
                    ) ||
                    "application/octet-stream"
            }
        });


    await cache.put(
        cacheKey,
        cachedResponse.clone()
    );


    log(
        `${label}: 다운로드 완료`,
        "success"
    );


    return cachedResponse;

}


/* =========================================================
   파일 크기
========================================================= */

function formatBytes(bytes) {

    if (!bytes)
        return "0 B";

    const units =
        ["B", "KB", "MB", "GB"];

    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        bytes /
        Math.pow(1024, index)
    ).toFixed(2) +
        " " +
        units[index];

}


/* =========================================================
   Mojang Version Manifest
========================================================= */

async function fetchVersionManifest() {

    log(
        "Mojang 버전 Manifest 요청 중...",
        "info"
    );


    try {

        const response =
            await fetch(
                VERSION_MANIFEST_URL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !Array.isArray(data.versions)
        ) {

            throw new Error(
                "올바르지 않은 Manifest 형식"
            );

        }


        allVersions =
            data.versions;


        log(
            `Mojang에서 ${allVersions.length}개의 버전 정보를 받았습니다.`,
            "success"
        );


        filterVersions();


        versionSelect.disabled =
            false;


    } catch (error) {

        log(
            `버전 Manifest 로딩 실패: ${error.message}`,
            "error"
        );


        versionSelect.innerHTML =
            `<option value="">
                버전 로딩 실패
            </option>`;

    }

}


/* =========================================================
   버전 필터
========================================================= */

function filterVersions() {

    const type =
        versionType.value;


    let filtered =
        allVersions.filter(
            version => {

                return (
                    type === "all" ||
                    version.type === type
                );

            }
        );


    /*
       최신 release/snapshot 순
    */

    filtered.sort(
        (a, b) => {

            return (
                new Date(b.releaseTime) -
                new Date(a.releaseTime)
            );

        }
    );


    versionSelect.innerHTML =
        "";


    for (const version of filtered) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            version.id;


        option.textContent =
            `${version.id} (${version.type})`;


        option.dataset.jsonUrl =
            version.url;


        option.dataset.releaseTime =
            version.releaseTime;


        versionSelect.appendChild(
            option
        );

    }


    if (filtered.length > 0) {

        versionSelect.value =
            filtered[0].id;

        updateSelectedVersion();

    }

}


/* =========================================================
   선택 버전 변경
========================================================= */

function updateSelectedVersion() {

    const option =
        versionSelect.options[
            versionSelect.selectedIndex
        ];


    if (!option) {

        currentVersion =
            null;

        currentVersionText.textContent =
            "-";

        manifestUrlText.textContent =
            "-";

        return;

    }


    currentVersion =
        option.value;


    currentVersionText.textContent =
        currentVersion;


    manifestUrlText.textContent =
        option.dataset.jsonUrl ||
        "-";


    log(
        `선택된 Minecraft 버전: ${currentVersion}`,
        "info"
    );

}


/* =========================================================
   Microsoft OAuth
========================================================= */

function startMicrosoftOAuth() {

    if (!CLIENT_ID) {

        log(
            "Microsoft OAuth Client ID가 설정되지 않았습니다.",
            "warning"
        );

        alert(
            "Microsoft 로그인을 사용하려면 Azure에서 발급받은 Client ID와 OAuth 서버 구성이 필요합니다."
        );

        return;

    }


    const scopes =
        encodeURIComponent(
            "XboxLive.signin offline_access"
        );


    const authUrl =
        "https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize" +
        `?client_id=${encodeURIComponent(CLIENT_ID)}` +
        "&response_type=code" +
        `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
        `&scope=${scopes}` +
        "&prompt=select_account";


    window.location.href =
        authUrl;

}


/* =========================================================
   OAuth Callback
========================================================= */

async function handleOAuthCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const code =
        params.get("code");


    if (!code) {

        launchButton.disabled =
            false;

        return;

    }


    log(
        "Microsoft 인증 코드를 받았습니다.",
        "info"
    );


    /*
       실제 Authorization Code → Xbox Live →
       XSTS → Minecraft 토큰 교환은
       보안을 위해 백엔드가 필요합니다.
    */

    log(
        "OAuth 백엔드 토큰 교환이 필요합니다.",
        "warning"
    );


    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

}


/* =========================================================
   Version JSON 가져오기
========================================================= */

async function fetchVersionJson(
    version,
    jsonUrl
) {

    log(
        `[${version}] version.json 요청`,
        "info"
    );


    if (!jsonUrl) {

        const manifestResponse =
            await fetch(
                VERSION_MANIFEST_URL,
                {
                    cache: "no-store"
                }
            );


        if (!manifestResponse.ok) {

            throw new Error(
                "Mojang Manifest를 불러올 수 없습니다."
            );

        }


        const manifest =
            await manifestResponse.json();


        const found =
            manifest.versions.find(
                v => v.id === version
            );


        if (!found) {

            throw new Error(
                `버전 ${version}을 찾을 수 없습니다.`
            );

        }


        jsonUrl =
            found.url;

    }


    const response =
        await fetch(
            jsonUrl,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `version.json HTTP ${response.status}`
        );

    }


    const data =
        await response.json();


    currentVersionJson =
        data;


    return data;

}


/* =========================================================
   Client 다운로드
========================================================= */

async function downloadClient(
    version,
    versionJson
) {

    if (
        !versionJson.downloads ||
        !versionJson.downloads.client ||
        !versionJson.downloads.client.url
    ) {

        throw new Error(
            "이 버전에는 client.jar 정보가 없습니다."
        );

    }


    const clientUrl =
        versionJson.downloads.client.url;


    const cacheKey =
        `https://minecraft.local/${version}/client.jar`;


    await downloadWithProgress(
        clientUrl,
        cacheKey,
        "Minecraft Client",
        5,
        35
    );

}


/* =========================================================
   Library Rules
========================================================= */

function isLibraryAllowed(library) {

    if (!library.rules)
        return true;


    let allowed = false;


    for (const rule of library.rules) {

        if (rule.action === "allow") {

            allowed = true;

        }

        if (rule.action === "disallow") {

            allowed = false;

        }

    }


    return allowed;

}


/* =========================================================
   Maven URL
========================================================= */

function getMavenUrl(
    library
) {

    if (
        library.downloads &&
        library.downloads.artifact &&
        library.downloads.artifact.url
    ) {

        return library.downloads.artifact.url;

    }


    if (
        !library.name
    ) {

        return null;

    }


    const parts =
        library.name.split(":");


    if (parts.length < 3) {

        return null;

    }


    const group =
        parts[0];

    const artifact =
        parts[1];

    const version =
        parts[2];


    let classifier =
        parts[3] || "";


    let extension =
        "jar";


    if (
        classifier.includes("@")
    ) {

        const split =
            classifier.split("@");

        classifier =
            split[0];

        extension =
            split[1] || "jar";

    }


    const path =
        group.replace(/\./g, "/") +
        "/" +
        artifact +
        "/" +
        version +
        "/" +
        artifact +
        "-" +
        version +
        (
            classifier
                ? "-" + classifier
                : ""
        ) +
        "." +
        extension;


    const base =
        library.url ||
        "https://libraries.minecraft.net/";


    return (
        base.replace(/\/+$/, "") +
        "/" +
        path
    );

}


/* =========================================================
   Libraries 다운로드
========================================================= */

async function downloadLibraries(
    version,
    versionJson
) {

    const libraries =
        Array.isArray(
            versionJson.libraries
        )
            ? versionJson.libraries
            : [];


    const allowed =
        libraries.filter(
            isLibraryAllowed
        );


    log(
        `${allowed.length}개의 Minecraft Library를 확인했습니다.`,
        "info"
    );


    const total =
        allowed.length;


    if (total === 0) {

        setProgress(
            65,
            "Libraries",
            "다운로드할 라이브러리가 없습니다."
        );

        return;

    }


    let completed = 0;


    /*
       브라우저 과부하를 막기 위해
       4개씩 처리
    */

    const concurrency =
        4;


    for (
        let i = 0;
        i < allowed.length;
        i += concurrency
    ) {

        const batch =
            allowed.slice(
                i,
                i + concurrency
            );


        await Promise.all(
            batch.map(
                async library => {

                    const url =
                        getMavenUrl(
                            library
                        );


                    if (!url) {

                        completed++;

                        return;

                    }


                    const name =
                        library.name ||
                        url;


                    try {

                        const safeName =
                            encodeURIComponent(
                                name
                            );


                        const cacheKey =
                            `https://minecraft.local/${version}/libraries/${safeName}`;


                        await downloadWithProgress(
                            url,
                            cacheKey,
                            `Library ${name}`,
                            35 +
                                (
                                    completed /
                                    total
                                ) *
                                30,
                            35 +
                                (
                                    (
                                        completed +
                                        1
                                    ) /
                                    total
                                ) *
                                30
                        );

                    } catch (error) {

                        log(
                            `Library 다운로드 실패: ${name} - ${error.message}`,
                            "warning"
                        );

                    }


                    completed++;

                }
            )
        );

    }


    setProgress(
        65,
        "Libraries 완료",
        `${total}개 Library 처리 완료`
    );

}


/* =========================================================
   Asset Index
========================================================= */

async function downloadAssets(
    version,
    versionJson
) {

    if (
        !versionJson.assetIndex ||
        !versionJson.assetIndex.url
    ) {

        log(
            "Asset Index 정보가 없습니다.",
            "warning"
        );

        return;

    }


    const assetIndexUrl =
        versionJson.assetIndex.url;


    log(
        "Minecraft Asset Index 다운로드 중...",
        "info"
    );


    const response =
        await fetch(
            assetIndexUrl,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `Asset Index HTTP ${response.status}`
        );

    }


    const index =
        await response.json();


    const objects =
        index.objects || {};


    const entries =
        Object.entries(
            objects
        );


    log(
        `${entries.length}개의 Asset을 확인했습니다.`,
        "info"
    );


    /*
       모든 Asset을 내려받으면 매우 큰 용량이
       발생할 수 있음.
    */

    const concurrency =
        6;


    let completed = 0;


    for (
        let i = 0;
        i < entries.length;
        i += concurrency
    ) {

        const batch =
            entries.slice(
                i,
                i + concurrency
            );


        await Promise.all(
            batch.map(
                async ([name, data]) => {

                    if (
                        !data ||
                        !data.hash
                    ) {

                        completed++;

                        return;

                    }


                    const hash =
                        data.hash;


                    const prefix =
                        hash.substring(
                            0,
                            2
                        );


                    const url =
                        `https://resources.download.minecraft.net/${prefix}/${hash}`;


                    const safeName =
                        encodeURIComponent(
                            name
                        );


                    const cacheKey =
                        `https://minecraft.local/${version}/assets/${safeName}`;


                    try {

                        await downloadWithProgress(
                            url,
                            cacheKey,
                            `Asset ${name}`,
                            65 +
                                (
                                    completed /
                                    entries.length
                                ) *
                                30,
                            65 +
                                (
                                    (
                                        completed +
                                        1
                                    ) /
                                    entries.length
                                ) *
                                30
                        );

                    } catch (error) {

                        log(
                            `Asset 다운로드 실패: ${name}`,
                            "warning"
                        );

                    }


                    completed++;

                }
            )
        );

    }


    setProgress(
        95,
        "Assets 완료",
        `${entries.length}개 Asset 처리 완료`
    );

}


/* =========================================================
   Minecraft 실행
========================================================= */

async function launchMinecraft() {

    if (!currentVersion) {

        alert(
            "Minecraft 버전을 선택해주세요."
        );

        return;

    }


    launchButton.disabled =
        true;


    loadingOverlay.style.display =
        "flex";


    try {

        const option =
            versionSelect.options[
                versionSelect.selectedIndex
            ];


        const version =
            option.value;


        const jsonUrl =
            option.dataset.jsonUrl;


        log(
            `Minecraft ${version} 준비를 시작합니다.`,
            "info"
        );


        setProgress(
            2,
            "Manifest",
            "버전 정보를 가져오는 중..."
        );


        /*
           A-1
           Version Manifest
        */

        const versionJson =
            await fetchVersionJson(
                version,
                jsonUrl
            );


        log(
            `[A-1] ${version} version.json 로딩 완료`,
            "success"
        );


        setProgress(
            5,
            "Client",
            "Minecraft Client를 준비하는 중..."
        );


        /*
           A-2
           Client
        */

        await downloadClient(
            version,
            versionJson
        );


        log(
            `[A-2] Minecraft Client 준비 완료`,
            "success"
        );


        /*
           A-3
           Libraries
        */

        setProgress(
            35,
            "Libraries",
            "Minecraft Libraries를 준비하는 중..."
        );


        await downloadLibraries(
            version,
            versionJson
        );


        log(
            `[A-3] Libraries 처리 완료`,
            "success"
        );


        /*
           A-4
           Assets
        */

        setProgress(
            65,
            "Assets",
            "Minecraft Assets를 준비하는 중..."
        );


        await downloadAssets(
            version,
            versionJson
        );


        log(
            `[A-4] Assets 처리 완료`,
            "success"
        );


        setProgress(
            100,
            "준비 완료",
            "Minecraft 실행 환경 준비 완료"
        );


        log(
            `Minecraft ${version} 파일 준비가 완료되었습니다.`,
            "success"
        );


        /*
           현재 단계에서는 파일 다운로드/캐싱까지 구현.
           
           실제 Java Minecraft 실행은
           브라우저용 JVM/WASM 런타임과
           정확한 classpath, natives, JVM arguments,
           인증 토큰 등이 추가로 필요함.
        */

        log(
            "현재 A단계는 Minecraft 파일 준비 단계입니다.",
            "info"
        );


        log(
            "실제 게임 실행 엔진 연결을 준비합니다.",
            "info"
        );


        /*
           CheerpJ가 페이지에 존재하는 경우
           기본 Display를 생성.
        */

        if (
            typeof cheerpjCreateDisplay ===
            "function"
        ) {

            try {

                cheerpjCreateDisplay(
                    document.getElementById(
                        "screen-container"
                    ).clientWidth,
                    document.getElementById(
                        "screen-container"
                    ).clientHeight
                );


                log(
                    "CheerpJ Display 생성 완료.",
                    "success"
                );

            } catch (error) {

                log(
                    `CheerpJ Display 생성 실패: ${error.message}`,
                    "warning"
                );

            }

        }


    } catch (error) {

        console.error(error);


        log(
            `실행 준비 중 오류: ${error.message}`,
            "error"
        );


        setProgress(
            0,
            "오류",
            error.message
        );


    } finally {

        launchButton.disabled =
            false;

    }

}

   이벤트
========================================================= */

versionType.addEventListener(
    "change",
    () => {

        filterVersions();

    }
);


versionSelect.addEventListener(
    "change",
    () => {

        updateSelectedVersion();

    }
);


/* =========================================================
   초기화
========================================================= */

async function initialize() {

    log(
        "Minecraft Web Launcher 초기화",
        "info"
    );


    /*
       OAuth callback 확인
    */

    await handleOAuthCallback();


    /*
       Mojang 공식 Version Manifest
    */

    await fetchVersionManifest();


    /*
       초기 선택값
    */

    updateSelectedVersion();


    log(
        "초기화 완료.",
        "success"
    );

}


window.addEventListener(
    "load",
    initialize
);
