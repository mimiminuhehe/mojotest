<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoCraft Core Engine & Runtime</title>

<!-- WebAssembly 기반 JVM (CheerpJ v3) 로더 -->
<script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #0e0e10;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

/* 헤더 */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 24px;
    font-weight: 800;
}

.back-btn {
    border: 1px solid #3b3b40;
    background: #222226;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
}

.back-btn:hover { background: #2c2c31; }

/* 게임 캔버스 컨테이너 */
#game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: #000;
    border: 2px solid #333;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#cheerpjDisplay {
    width: 100% !important;
    height: 100% !important;
}

/* 상태 표시 오버레이 */
.game-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    z-index: 10;
}

.progress-text {
    font-size: 18px;
    font-weight: bold;
    color: #76ff03;
}

/* 실행 제어 버튼 */
.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.action-btn {
    padding: 14px;
    border: 1px solid #3b3b40;
    border-radius: 8px;
    background: #252529;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}

.action-btn:hover:not(:disabled) { background: #303035; }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-launch {
    background: #76ff03;
    color: #000;
    font-size: 16px;
}
.btn-launch:hover:not(:disabled) { background: #8cff35; }

/* 엔진 로그 패널 */
.log-card {
    background: #0d0d0f;
    border: 1px solid #29292e;
    border-radius: 10px;
    overflow: hidden;
}

.log-header {
    padding: 10px 14px;
    background: #18181b;
    border-bottom: 1px solid #29292e;
    font-weight: 700;
    font-size: 13px;
}

#log {
    height: 180px;
    padding: 12px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
}

.log { margin-bottom: 4px; line-height: 1.4; }
.log.info { color: #aaa; }
.log.success { color: #6cff55; }
.log.error { color: #ff5555; }
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div>
            <div class="title">MojoCraft Web Engine</div>
            <div style="font-size: 12px; color: #888;">Minecraft Java Edition Web Engine</div>
        </div>
        <button class="back-btn" onclick="goBack()">← 런처로 돌아가기</button>
    </header>

    <!-- 1. 게임 실행 화면 (Canvas) -->
    <div id="game-container">
        <div id="game-overlay" class="game-overlay">
            <div id="overlay-status" class="progress-text">버튼을 눌러 리소스를 다운로드하세요.</div>
        </div>
        <div id="cheerpjDisplay"></div>
    </div>

    <!-- 2. 다운로드 및 시작 제어 -->
    <section class="actions">
        <button id="prep-btn" class="action-btn" onclick="prepareFiles()">1. 리소스 다운로드</button>
        <button id="launch-btn" class="action-btn btn-launch" onclick="launchJavaMinecraft()" disabled>2. 게임 실행</button>
    </section>

    <!-- 3. 로그 콘솔 -->
    <section class="log-card">
        <div class="log-header">Engine Log</div>
        <div id="log"></div>
    </section>

</div>

<script>
/* 파라미터 수신 */
const launchParams = new URLSearchParams(window.location.search);
const LAUNCH_VERSION = launchParams.get("version") || "1.12.2";
const LAUNCH_JSON_URL = launchParams.get("json");
const LAUNCH_USERNAME = launchParams.get("username") || "Player";

/* CORS 프록시 설정 (기본 프록시 연결 문제 시 대체 주소 활용) */
const CORS_PROXY = "https://corsproxy.io/?";

let currentVersionData = null;
let isReadyToLaunch = false;

function log(message, type = "info") {
    const element = document.getElementById("log");
    const line = document.createElement("div");
    line.className = `log ${type}`;
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${message}`;
    element.appendChild(line);
    element.scrollTop = element.scrollHeight;
}

function updateOverlay(text, show = true) {
    const overlay = document.getElementById("game-overlay");
    const status = document.getElementById("overlay-status");
    status.textContent = text;
    overlay.style.display = show ? "flex" : "none";
}

/* =========================================================
   1. Client 및 Manifest 실제 다운로드 파이프라인
========================================================= */
async function prepareFiles() {
    log(`[시스템] ${LAUNCH_VERSION} 리소스 받기를 시작합니다.`, "info");
    updateOverlay("버전 메타데이터 다운로드 중...");

    try {
        let jsonUrl = LAUNCH_JSON_URL;
        if (!jsonUrl) {
            jsonUrl = `https://piston-meta.mojang.com/mc/game/version_manifest_v2.json`;
        }

        // 1. Version Manifest 로드
        const targetUrl = CORS_PROXY + encodeURIComponent(jsonUrl);
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error("Manifest 요청 실패");
        
        currentVersionData = await response.json();
        log("Version.json 읽기 성공", "success");

        updateOverlay("Client JAR 다운로드 중...");
        
        // 2. Client JAR URL 확인
        const clientJarUrl = currentVersionData.downloads?.client?.url;
        if (!clientJarUrl) {
            throw new Error("Client JAR 다운로드 경로를 찾을 수 없습니다.");
        }

        // 3. Client JAR 실제 바이너리 받기
        const clientTarget = CORS_PROXY + encodeURIComponent(clientJarUrl);
        const jarRes = await fetch(clientTarget);
        if (!jarRes.ok) throw new Error(`Client 파일 다운로드 실패 (HTTP ${jarRes.status})`);

        const jarData = await jarRes.arrayBuffer();
        
        // 4. Cache Storage에 파일 저장
        if ('caches' in window) {
            const cache = await caches.open("mojocraft-runtime");
            const responseToCache = new Response(jarData, {
                headers: { 'Content-Type': 'application/java-archive' }
            });
            await cache.put('/app/minecraft.jar', responseToCache);
            log("Cache Storage에 Client JAR 저장 완료", "success");
        }

        log(`Client JAR 다운로드 완료 (${(jarData.byteLength / 1024 / 1024).toFixed(1)} MB)`, "success");

        updateOverlay("파일 준비 완료! '게임 실행' 버튼을 누르세요.", true);
        document.getElementById("launch-btn").disabled = false;
        isReadyToLaunch = true;

    } catch (err) {
        log(`다운로드 에러: ${err.message}`, "error");
        updateOverlay(`준비 실패: ${err.message}`);
    }
}

/* =========================================================
   2. CheerpJ JVM 구동
========================================================= */
async function launchJavaMinecraft() {
    if (!isReadyToLaunch) return;

    log("CheerpJ JVM 초기화 시작...", "info");
    updateOverlay("CheerpJ 자바 엔진 초기화 중...");

    try {
        // CheerpJ 초기화
        await cheerpjInit({
            displayContainer: document.getElementById("cheerpjDisplay")
        });

        log("JVM 초기화 완료! 마인크래프트 실행 중...", "success");
        updateOverlay("", false);

        // 자바 실행 파일 지정 구동
        await cheerpjRunLibrary("/app/minecraft.jar");

    } catch (error) {
        log(`Java 실행 실패: ${error.message}`, "error");
        updateOverlay("게임 실행 에러 발생!");
    }
}

function goBack() {
    window.location.href = "./index.html";
}

window.addEventListener("DOMContentLoaded", () => {
    log(`MojoCraft Engine 로드 완료 - 버전: ${LAUNCH_VERSION}`, "info");
});
</script>
</body>
</html>
