<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MojoCraft Core Engine - A</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #0d0d0d;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            overflow-y: auto;
        }


        /* =====================================================
           전체
        ===================================================== */

        #app {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background: #0d0d0d;
        }


        /* =====================================================
           상단
        ===================================================== */

        #header {
            width: 100%;

            padding:
                18px 24px;

            background: #171717;

            border-bottom:
                1px solid #303030;
        }


        #title {
            font-size: 22px;

            font-weight: 800;
        }


        #subtitle {
            margin-top: 5px;

            font-size: 12px;

            color: #777;
        }


        /* =====================================================
           메인
        ===================================================== */

        #content {
            width: min(1100px, 100%);

            margin: 0 auto;

            padding: 24px;

            display: grid;

            grid-template-columns:
                360px 1fr;

            gap: 20px;
        }


        /* =====================================================
           카드
        ===================================================== */

        .card {
            background: #181818;

            border:
                1px solid #303030;

            border-radius: 12px;

            padding: 18px;
        }


        .card-title {
            font-size: 15px;

            font-weight: 700;

            margin-bottom: 14px;
        }


        /* =====================================================
           버전 목록
        ===================================================== */

        #version-search {
            width: 100%;

            padding: 11px;

            border:
                1px solid #383838;

            border-radius: 7px;

            background: #222;

            color: #fff;

            outline: none;

            margin-bottom: 10px;
        }


        #version-search:focus {
            border-color: #666;
        }


        #version-list {
            height: 500px;

            overflow-y: auto;

            background: #111;

            border:
                1px solid #2c2c2c;

            border-radius: 8px;
        }


        .version-item {
            padding:
                11px 12px;

            border-bottom:
                1px solid #292929;

            cursor: pointer;
        }


        .version-item:hover {
            background: #242424;
        }


        .version-item.selected {
            background: #303030;

            box-shadow:
                inset 3px 0 0 #4caf50;
        }


        .version-name {
            font-size: 13px;

            font-weight: 700;
        }


        .version-type {
            margin-top: 3px;

            font-size: 10px;

            color: #777;
        }


        /* =====================================================
           선택 정보
        ===================================================== */

        #selected-version {
            padding: 12px;

            background: #111;

            border:
                1px solid #292929;

            border-radius: 8px;

            margin-bottom: 14px;
        }


        #selected-version-name {
            font-size: 18px;

            font-weight: 800;
        }


        #selected-version-url {
            margin-top: 7px;

            font-size: 10px;

            color: #777;

            word-break: break-all;
        }


        /* =====================================================
           버튼
        ===================================================== */

        .button-row {
            display: flex;

            gap: 8px;

            margin-top: 12px;
        }


        button {
            font-family: inherit;
        }


        .engine-button {
            flex: 1;

            padding: 11px;

            border:
                1px solid #3b3b3b;

            border-radius: 7px;

            background: #252525;

            color: #fff;

            cursor: pointer;

            font-weight: 700;
        }


        .engine-button:hover {
            background: #303030;
        }


        .engine-button.primary {
            background: #4caf50;

            border-color: #4caf50;
        }


        .engine-button.primary:hover {
            background: #5bbb5f;
        }


        .engine-button:disabled {
            opacity: .45;

            cursor: not-allowed;
        }


        /* =====================================================
           진행률
        ===================================================== */

        #progress-section {
            margin-top: 20px;
        }


        #progress-background {
            width: 100%;

            height: 9px;

            background: #303030;

            border-radius: 999px;

            overflow: hidden;
        }


        #progress-bar {
            width: 0%;

            height: 100%;

            background: #4caf50;

            transition:
                width .2s ease;
        }


        #progress-info {
            display: flex;

            justify-content: space-between;

            margin-top: 7px;

            font-size: 11px;

            color: #777;
        }


        /* =====================================================
           통계
        ===================================================== */

        #stats {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px;

            margin-top: 16px;
        }


        .stat {
            padding: 12px;

            background: #111;

            border:
                1px solid #292929;

            border-radius: 8px;
        }


        .stat-name {
            font-size: 10px;

            color: #777;
        }


        .stat-value {
            margin-top: 5px;

            font-size: 16px;

            font-weight: 700;
        }


        /* =====================================================
           로그
        ===================================================== */

        #log-title {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 8px;
        }


        #clear-log {
            padding:
                5px 8px;

            border:
                1px solid #333;

            border-radius: 5px;

            background: #222;

            color: #aaa;

            cursor: pointer;

            font-size: 10px;
        }


        #log {
            height: 620px;

            overflow-y: auto;

            padding: 12px;

            background: #090909;

            border:
                1px solid #292929;

            border-radius: 8px;

            font-family:
                "Consolas",
                monospace;

            font-size: 11px;

            line-height: 1.6;
        }


        .log-line {
            white-space: pre-wrap;

            word-break: break-word;
        }


        .log-time {
            color: #555;
        }


        .log-info {
            color: #8bbcff;
        }


        .log-success {
            color: #7bd47b;
        }


        .log-warning {
            color: #e5c46b;
        }


        .log-error {
            color: #ff7777;
        }


        /* =====================================================
           모바일
        ===================================================== */

        @media (max-width: 800px) {

            #content {
                grid-template-columns: 1fr;

                padding: 14px;
            }


            #version-list {
                height: 350px;
            }


            #log {
                height: 400px;
            }

        }

    </style>

</head>



<body>


<div id="app">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header id="header">

        <div id="title">
            MojoCraft Core Engine
        </div>

        <div id="subtitle">
            A 단계 · Minecraft Java 파일 로더
        </div>

    </header>



    <!-- =====================================================
         CONTENT
    ===================================================== -->

    <main id="content">


        <!-- =================================================
             왼쪽
        ================================================= -->

        <section class="card">


            <div class="card-title">
                Minecraft 버전
            </div>


            <input
                id="version-search"
                type="text"
                placeholder="버전 검색..."
            >


            <div
                id="version-list"
            >

                <div
                    style="
                        padding:20px;
                        color:#777;
                        text-align:center;
                    "
                >
                    버전 목록을 불러오는 중...
                </div>

            </div>


        </section>



        <!-- =================================================
             오른쪽
        ================================================= -->

        <section>


            <!-- 선택된 버전 -->

            <div class="card">


                <div class="card-title">
                    선택된 Minecraft
                </div>


                <div id="selected-version">


                    <div
                        id="selected-version-name"
                    >
                        선택되지 않음
                    </div>


                    <div
                        id="selected-version-url"
                    >
                        Minecraft 버전을 선택하세요.
                    </div>


                </div>


                <div class="button-row">


                    <button
                        id="load-metadata"
                        class="engine-button primary"
                        disabled
                    >
                        버전 정보 읽기
                    </button>


                    <button
                        id="download-client"
                        class="engine-button"
                        disabled
                    >
                        Client 다운로드
                    </button>


                </div>


                <div class="button-row">


                    <button
                        id="download-libraries"
                        class="engine-button"
                        disabled
                    >
                        Libraries 다운로드
                    </button>


                    <button
                        id="download-assets"
                        class="engine-button"
                        disabled
                    >
                        Assets 다운로드
                    </button>


                </div>


            </div>



            <!-- 진행률 -->

            <div
                id="progress-section"
                class="card"
            >


                <div class="card-title">
                    다운로드 상태
                </div>


                <div
                    id="progress-background"
                >

                    <div
                        id="progress-bar"
                    ></div>

                </div>


                <div id="progress-info">


                    <span
                        id="progress-message"
                    >
                        대기 중
                    </span>


                    <span
                        id="progress-percent"
                    >
                        0%
                    </span>


                </div>



                <!-- 통계 -->

                <div id="stats">


                    <div class="stat">

                        <div class="stat-name">
                            Files
                        </div>

                        <div
                            id="stat-files"
                            class="stat-value"
                        >
                            0
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-name">
                            Downloaded
                        </div>

                        <div
                            id="stat-downloaded"
                            class="stat-value"
                        >
                            0 B
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-name">
                            Cached
                        </div>

                        <div
                            id="stat-cached"
                            class="stat-value"
                        >
                            0
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-name">
                            Assets
                        </div>

                        <div
                            id="stat-assets"
                            class="stat-value"
                        >
                            0
                        </div>

                    </div>


                </div>


            </div>



            <!-- 로그 -->

            <div
                class="card"
                style="margin-top:20px;"
            >


                <div id="log-title">


                    <div class="card-title"
                         style="margin:0;">
                        Engine Log
                    </div>


                    <button
                        id="clear-log"
                    >
                        로그 지우기
                    </button>


                </div>


                <div id="log"></div>


            </div>


        </section>


    </main>


</div>



<script>


/* ============================================================
   MojoCraft Core Engine
   A 단계

   역할:

   1. Mojang version manifest 가져오기
   2. Minecraft version JSON 가져오기
   3. Client 정보 분석
   4. Libraries 정보 분석
   5. Assets index 분석
   6. Client 다운로드
   7. Libraries 다운로드
   8. Assets 다운로드
   9. Cache Storage 저장
   ============================================================ */



/* ============================================================
   설정
============================================================ */


/*
    Mojang 공식 버전 Manifest
*/

const VERSION_MANIFEST_URL =
    "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json";


/*
    브라우저 Cache Storage 이름

    나중에 Core Engine 버전이 올라가면
    이름을 바꿔서 캐시를 분리할 수 있음.
*/

const CACHE_NAME =
    "mojocraft-minecraft-files-v1";



/* ============================================================
   상태
============================================================ */

let allVersions = [];

let selectedVersion = null;

let selectedVersionMetadata = null;



/* ============================================================
   DOM
============================================================ */

const versionSearch =
    document.getElementById(
        "version-search"
    );


const versionList =
    document.getElementById(
        "version-list"
    );


const selectedVersionName =
    document.getElementById(
        "selected-version-name"
    );


const selectedVersionUrl =
    document.getElementById(
        "selected-version-url"
    );


const loadMetadataButton =
    document.getElementById(
        "load-metadata"
    );


const downloadClientButton =
    document.getElementById(
        "download-client"
    );


const downloadLibrariesButton =
    document.getElementById(
        "download-libraries"
    );


const downloadAssetsButton =
    document.getElementById(
        "download-assets"
    );


const progressBar =
    document.getElementById(
        "progress-bar"
    );


const progressMessage =
    document.getElementById(
        "progress-message"
    );


const progressPercent =
    document.getElementById(
        "progress-percent"
    );


const statFiles =
    document.getElementById(
        "stat-files"
    );


const statDownloaded =
    document.getElementById(
        "stat-downloaded"
    );


const statCached =
    document.getElementById(
        "stat-cached"
    );


const statAssets =
    document.getElementById(
        "stat-assets"
    );


const logElement =
    document.getElementById(
        "log"
    );


const clearLogButton =
    document.getElementById(
        "clear-log"
    );



/* ============================================================
   로그
============================================================ */

function log(
    message,
    type = "info"
) {


    const line =
        document.createElement(
            "div"
        );


    line.className =
        "log-line";


    if (
        type === "success"
    ) {

        line.classList.add(
            "log-success"
        );

    }


    if (
        type === "warning"
    ) {

        line.classList.add(
            "log-warning"
        );

    }


    if (
        type === "error"
    ) {

        line.classList.add(
            "log-error"
        );

    }


    if (
        type === "info"
    ) {

        line.classList.add(
            "log-info"
        );

    }


    const now =
        new Date()
            .toLocaleTimeString();


    line.innerHTML =
        `<span class="log-time">[${now}]</span> ${escapeHtml(message)}`;


    logElement.appendChild(
        line
    );


    logElement.scrollTop =
        logElement.scrollHeight;

}



/* ============================================================
   HTML escape
============================================================ */

function escapeHtml(
    value
) {


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* ============================================================
   용량 표시
============================================================ */

function formatBytes(
    bytes
) {


    if (
        !bytes ||
        bytes <= 0
    ) {

        return "0 B";

    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];


    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    const safeIndex =
        Math.min(
            index,
            units.length - 1
        );


    return (
        bytes /
        Math.pow(
            1024,
            safeIndex
        )
    ).toFixed(
        safeIndex === 0
            ? 0
            : 2
    )
    + " "
    + units[safeIndex];

}



/* ============================================================
   진행률
============================================================ */

function setProgress(
    percent,
    message
) {


    const safePercent =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );


    progressBar.style.width =
        `${safePercent}%`;


    progressPercent.textContent =
        `${Math.round(safePercent)}%`;


    if (
        message
    ) {

        progressMessage.textContent =
            message;

    }

}



/* ============================================================
   버튼 상태
============================================================ */

function updateButtons() {


    const hasVersion =
        !!selectedVersion;


    const hasMetadata =
        !!selectedVersionMetadata;


    loadMetadataButton.disabled =
        !hasVersion;


    downloadClientButton.disabled =
        !hasMetadata ||
        !selectedVersionMetadata.downloads ||
        !selectedVersionMetadata.downloads.client;


    downloadLibrariesButton.disabled =
        !hasMetadata;


    downloadAssetsButton.disabled =
        !hasMetadata ||
        !selectedVersionMetadata.assetIndex;

}



/* ============================================================
   Mojang Version Manifest
============================================================ */

async function loadVersionManifest() {


    log(
        "Mojang 공식 버전 목록을 요청합니다..."
    );


    try {


        const response =
            await fetch(
                VERSION_MANIFEST_URL,
                {
                    method: "GET",
                    cache: "no-cache"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            !data.versions ||
            !Array.isArray(
                data.versions
            )
        ) {

            throw new Error(
                "versions 배열을 찾을 수 없습니다."
            );

        }


        allVersions =
            data.versions;


        log(
            `총 ${allVersions.length}개의 Minecraft 버전을 받았습니다.`,
            "success"
        );


        renderVersions();


    } catch (
        error
    ) {


        log(
            `버전 목록 로드 실패: ${error.message}`,
            "error"
        );


        versionList.innerHTML =
            `
                <div
                    style="
                        padding:20px;
                        color:#ff7777;
                        text-align:center;
                    "
                >
                    버전 목록을 불러오지 못했습니다.
                    <br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

    }

}



/* ============================================================
   버전 목록 표시
============================================================ */

function renderVersions() {


    const search =
        versionSearch.value
            .trim()
            .toLowerCase();


    versionList.innerHTML =
        "";


    const filtered =
        allVersions.filter(
            function(version) {


                if (
                    search &&
                    !version.id
                        .toLowerCase()
                        .includes(
                            search
                        )
                ) {

                    return false;

                }


                return true;

            }
        );


    if (
        filtered.length === 0
    ) {


        versionList.innerHTML =
            `
                <div
                    style="
                        padding:20px;
                        text-align:center;
                        color:#777;
                    "
                >
                    검색 결과가 없습니다.
                </div>
            `;


        return;

    }


    filtered.forEach(
        function(version) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "version-item";


            if (
                selectedVersion &&
                selectedVersion.id ===
                version.id
            ) {

                item.classList.add(
                    "selected"
                );

            }


            item.innerHTML =
                `
                    <div class="version-name">
                        ${escapeHtml(version.id)}
                    </div>

                    <div class="version-type">
                        ${escapeHtml(version.type || "unknown")}
                        ·
                        ${escapeHtml(version.releaseTime || "")}
                    </div>
                `;


            item.addEventListener(
                "click",
                function() {

                    selectVersion(
                        version
                    );

                }
            );


            versionList.appendChild(
                item
            );

        }
    );

}



/* ============================================================
   버전 선택
============================================================ */

function selectVersion(
    version
) {


    selectedVersion =
        version;


    selectedVersionMetadata =
        null;


    selectedVersionName.textContent =
        version.id;


    selectedVersionUrl.textContent =
        version.url;


    setProgress(
        0,
        "버전이 선택되었습니다."
    );


    log(
        `Minecraft ${version.id} 선택`,
        "success"
    );


    log(
        `Version JSON: ${version.url}`
    );


    renderVersions();


    updateButtons();

}



/* ============================================================
   Version JSON 읽기
============================================================ */

async function loadSelectedVersionMetadata() {


    if (
        !selectedVersion
    ) {

        return;

    }


    loadMetadataButton.disabled =
        true;


    setProgress(
        0,
        "Minecraft version.json 다운로드 중..."
    );


    log(
        `Minecraft ${selectedVersion.id}의 version.json을 가져옵니다...`
    );


    try {


        const response =
            await fetch(
                selectedVersion.url
            );


        if (
            !response.ok
        ) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const metadata =
            await response.json();


        selectedVersionMetadata =
            metadata;


        /*
            기본 구조 검사
        */

        if (
            !metadata.id
        ) {

            throw new Error(
                "version.json에 id가 없습니다."
            );

        }


        log(
            `Version JSON 확인 완료: ${metadata.id}`,
            "success"
        );


        /*
            Client
        */

        if (
            metadata.downloads &&
            metadata.downloads.client
        ) {


            const client =
                metadata.downloads.client;


            log(
                `Client URL 확인: ${client.url}`
            );


            log(
                `Client SHA-1: ${client.sha1}`
            );


            log(
                `Client Size: ${formatBytes(client.size)}`
            );


        } else {


            log(
                "Client 다운로드 정보가 없습니다.",
                "warning"
            );

        }


        /*
            Libraries
        */

        const libraries =
            Array.isArray(
                metadata.libraries
            )
                ? metadata.libraries
                : [];


        log(
            `Libraries: ${libraries.length}개`,
            "success"
        );


        /*
            Assets
        */

        if (
            metadata.assetIndex
        ) {


            log(
                `Asset Index: ${metadata.assetIndex.id}`
            );


            log(
                `Asset Index URL: ${metadata.assetIndex.url}`
            );


        } else {


            log(
                "Asset Index 정보가 없습니다.",
                "warning"
            );

        }


        /*
            Arguments
        */

        if (
            metadata.arguments
        ) {

            log(
                "새로운 arguments 형식을 사용하는 Minecraft 버전입니다."
            );

        } else if (
            metadata.minecraftArguments
        ) {

            log(
                "legacy minecraftArguments 형식을 사용하는 Minecraft 버전입니다."
            );

        }


        setProgress(
            100,
            "버전 정보 분석 완료"
        );


        updateButtons();


    } catch (
        error
    ) {


        selectedVersionMetadata =
            null;


        log(
            `version.json 로드 실패: ${error.message}`,
            "error"
        );


        setProgress(
            0,
            "오류"
        );


        updateButtons();

    } finally {


        loadMetadataButton.disabled =
            !selectedVersion;

    }

}



/* ============================================================
   Cache Storage
============================================================ */

async function openEngineCache() {


    if (
        !("caches" in window)
    ) {

        throw new Error(
            "이 브라우저에서는 Cache Storage를 사용할 수 없습니다."
        );

    }


    return await caches.open(
        CACHE_NAME
    );

}



/* ============================================================
   캐시 확인
============================================================ */

async function getCachedResponse(
    url
) {


    const cache =
        await openEngineCache();


    return await cache.match(
        url
    );

}



/* ============================================================
   URL 다운로드
============================================================ */

async function downloadToCache(
    url,
    expectedSize = 0,
    label = "파일"
) {


    const cache =
        await openEngineCache();


    /*
        이미 캐시에 있는지 확인
    */

    const existing =
        await cache.match(
            url
        );


    if (
        existing
    ) {


        log(
            `캐시 사용: ${label}`
        );


        return {
            cached: true,
            size: expectedSize || 0
        };

    }


    log(
        `다운로드 시작: ${label}`
    );


    const response =
        await fetch(
            url
        );


    if (
        !response.ok
    ) {

        throw new Error(
            `${response.status} ${response.statusText}`
        );

    }


    /*
        Cache Storage에 저장
    */

    await cache.put(
        url,
        response.clone()
    );


    let size =
        expectedSize || 0;


    if (
        !size
    ) {

        const contentLength =
            response.headers.get(
                "content-length"
            );


        if (
            contentLength
        ) {

            size =
                Number(
                    contentLength
                );

            }

    }


    log(
        `다운로드 완료: ${label}`,
        "success"
    );


    return {
        cached: false,
        size: size
    };

}



/* ============================================================
   Client 다운로드
============================================================ */

async function downloadClient() {


    if (
        !selectedVersionMetadata
    ) {

        return;

    }


    const client =
        selectedVersionMetadata
            .downloads
            ?.client;


    if (
        !client ||
        !client.url
    ) {


        log(
            "Client 다운로드 정보가 없습니다.",
            "error"
        );


        return;

    }


    downloadClientButton.disabled =
        true;


    setProgress(
        0,
        "Client 확인 중..."
    );


    try {


        const cached =
            await getCachedResponse(
                client.url
            );


        if (
            cached
        ) {


            log(
                `Client가 이미 캐시에 있습니다: Minecraft ${selectedVersion.id}`,
                "success"
            );


            statCached.textContent =
                "1";


            setProgress(
                100,
                "Client 캐시 사용"
            );


            return;

        }


        setProgress(
            10,
            "Client 다운로드 중..."
        );


        const result =
            await downloadToCache(
                client.url,
                client.size,
                `Minecraft ${selectedVersion.id} client.jar`
            );


        if (
            result.size
        ) {


            statDownloaded.textContent =
                formatBytes(
                    result.size
                );

        }


        setProgress(
            100,
            "Client 다운로드 완료"
        );


        log(
            `Client SHA-1: ${client.sha1}`
        );


    } catch (
        error
    ) {


        log(
            `Client 다운로드 실패: ${error.message}`,
            "error"
        );


        setProgress(
            0,
            "Client 다운로드 실패"
        );


    } finally {


        downloadClientButton.disabled =
            false;

    }

}



/* ============================================================
   Library URL 찾기
============================================================ */

function getLibraryDownload(
    library
) {


    /*
        Minecraft 1.13+
        대부분의 경우 downloads.artifact 사용
    */

    if (
        library.downloads &&
        library.downloads.artifact &&
        library.downloads.artifact.url
    ) {


        return library.downloads.artifact;

    }


    /*
        일부 구버전 / 다른 구조 대응
    */

    if (
        library.url
    ) {


        /*
            Maven 이름을 URL로 변환
        */

        const parts =
            library.name.split(":");


        if (
            parts.length >= 3
        ) {


            const group =
                parts[0]
                    .replace(
                        /\./g,
                        "/"
                    );


            const artifact =
                parts[1];


            const version =
                parts[2];


            const classifier =
                parts[3];


            let filename =
                `${artifact}-${version}`;


            if (
                classifier
            ) {

                filename +=
                    `-${classifier}`;

            }


            filename +=
                ".jar";


            return {

                url:
                    library.url +
                    group +
                    "/" +
                    artifact +
                    "/" +
                    version +
                    "/" +
                    filename,

                path:
                    `${group}/${artifact}/${version}/${filename}`

            };

        }

    }


    return null;

}



/* ============================================================
   Libraries 다운로드
============================================================ */

async function downloadLibraries() {


    if (
        !selectedVersionMetadata
    ) {

        return;

    }


    const libraries =
        Array.isArray(
            selectedVersionMetadata.libraries
        )
            ? selectedVersionMetadata.libraries
            : [];


    if (
        libraries.length === 0
    ) {


        log(
            "다운로드할 Libraries가 없습니다.",
            "warning"
        );


        return;

    }


    downloadLibrariesButton.disabled =
        true;


    setProgress(
        0,
        "Libraries 준비 중..."
    );


    let downloadable =
        [];


    /*
        다운로드 가능한 라이브러리만 추림
    */

    for (
        const library of libraries
    ) {


        /*
            rules 검사

            이번 A 단계에서는
            기본적으로 rules가 있는 라이브러리 중
            명확하게 제외되는 것만 제외한다.
        */

        const download =
            getLibraryDownload(
                library
            );


        if (
            download &&
            download.url
        ) {


            downloadable.push({
                library,
                download
            });

        }

    }


    log(
        `전체 Libraries: ${libraries.length}개`
    );


    log(
        `다운로드 가능한 Libraries: ${downloadable.length}개`
    );


    statFiles.textContent =
        downloadable.length;


    let completed =
        0;


    let totalDownloaded =
        0;


    try {


        /*
            한 번에 너무 많은 요청을 보내지 않도록
            4개씩 처리
        */

        const CONCURRENCY =
            4;


        for (
            let i = 0;
            i < downloadable.length;
            i += CONCURRENCY
        ) {


            const batch =
                downloadable.slice(
                    i,
                    i + CONCURRENCY
                );


            const results =
                await Promise.all(
                    batch.map(
                        async function(item) {


                            try {


                                const result =
                                    await downloadToCache(
                                        item.download.url,
                                        item.download.size || 0,
                                        item.library.name
                                    );


                                return result;


                            } catch (
                                error
                            ) {


                                log(
                                    `Library 실패: ${item.library.name} → ${error.message}`,
                                    "error"
                                );


                                return {
                                    failed: true,
                                    size: 0
                                };

                            }

                        }
                    )
                );


            for (
                const result of results
            ) {


                completed++;


                if (
                    result.size
                ) {

                    totalDownloaded +=
                        result.size;

                }

            }


            const percent =
                (
                    completed /
                    downloadable.length
                ) * 100;


            setProgress(
                percent,
                `Libraries 다운로드 ${completed}/${downloadable.length}`
            );


            statDownloaded.textContent =
                formatBytes(
                    totalDownloaded
                );

        }


        setProgress(
            100,
            "Libraries 다운로드 완료"
        );


        log(
            `Libraries 처리 완료: ${completed}개`,
            "success"
        );


    } catch (
        error
    ) {


        log(
            `Libraries 처리 오류: ${error.message}`,
            "error"
        );


    } finally {


        downloadLibrariesButton.disabled =
            false;

    }

}



/* ============================================================
   Asset Index 다운로드
============================================================ */

async function downloadAssetIndex() {


    if (
        !selectedVersionMetadata ||
        !selectedVersionMetadata.assetIndex
    ) {

        throw new Error(
            "Asset Index가 없습니다."
        );

    }


    const assetIndex =
        selectedVersionMetadata.assetIndex;


    const result =
        await downloadToCache(
            assetIndex.url,
            assetIndex.size || 0,
            `Asset Index ${assetIndex.id}`
        );


    const cache =
        await openEngineCache();


    const response =
        await cache.match(
            assetIndex.url
        );


    if (
        !response
    ) {

        throw new Error(
            "Asset Index 캐시를 읽을 수 없습니다."
        );

    }


    const data =
        await response.json();


    return {
        metadata: assetIndex,
        data: data,
        downloadResult: result
    };

}



/* ============================================================
   Asset 다운로드
============================================================ */

async function downloadAssets() {


    if (
        !selectedVersionMetadata
    ) {

        return;

    }


    if (
        !selectedVersionMetadata.assetIndex
    ) {


        log(
            "Asset Index가 없습니다.",
            "error"
        );


        return;

    }


    downloadAssetsButton.disabled =
        true;


    try {


        setProgress(
            0,
            "Asset Index 다운로드 중..."
        );


        const assetResult =
            await downloadAssetIndex();


        const assets =
            assetResult.data.assets;


        if (
            !assets
        ) {

            throw new Error(
                "Asset 목록을 찾을 수 없습니다."
            );

        }


        const entries =
            Object.entries(
                assets
            );


        statAssets.textContent =
            entries.length;


        log(
            `Asset Index 확인 완료: ${entries.length}개`
        );


        /*
            중요:

            Minecraft Assets는 매우 많을 수 있다.

            그래서 이번 A 단계에서는
            Asset Index를 먼저 확보하고,
            실제 모든 Asset blob 다운로드는
            사용자가 버튼을 눌렀을 때 실행한다.

            여기서는 실제 다운로드를 진행한다.
        */


        let completed =
            0;


        let totalSize =
            0;


        const CONCURRENCY =
            6;


        /*
            모든 asset의 실제 URL 생성

            Mojang asset 서버:
            https://resources.download.minecraft.net/

            hash 앞 2글자를 경로로 사용
        */

        const downloadList =
            entries.map(
                function([
                    name,
                    asset
                ]) {


                    const hash =
                        asset.hash;


                    const url =
                        `https://resources.download.minecraft.net/${hash.substring(0,2)}/${hash}`;


                    return {
                        name,
                        hash,
                        size:
                            asset.size || 0,
                        url
                    };

                }
            );


        log(
            `실제 Asset 다운로드 대상: ${downloadList.length}개`
        );


        /*
            Assets가 굉장히 많기 때문에
            브라우저에서 한꺼번에 Promise를
            생성하지 않고 batch로 처리한다.
        */

        for (
            let i = 0;
            i < downloadList.length;
            i += CONCURRENCY
        ) {


            const batch =
                downloadList.slice(
                    i,
                    i + CONCURRENCY
                );


            const results =
                await Promise.all(
                    batch.map(
                        async function(asset) {


                            try {


                                const result =
                                    await downloadToCache(
                                        asset.url,
                                        asset.size,
                                        asset.name
                                    );


                                return result;


                            } catch (
                                error
                            ) {


                                log(
                                    `Asset 실패: ${asset.name} → ${error.message}`,
                                    "error"
                                );


                                return {
                                    failed: true,
                                    size: 0
                                };

                            }

                        }
                    )
                );


            for (
                const result of results
            ) {


                completed++;


                if (
                    result.size
                ) {

                    totalSize +=
                        result.size;

                }

            }


            const percent =
                (
                    completed /
                    downloadList.length
                ) * 100;


            setProgress(
                percent,
                `Assets 다운로드 ${completed}/${downloadList.length}`
            );


            statDownloaded.textContent =
                formatBytes(
                    totalSize
                );

        }


        setProgress(
            100,
            "Assets 다운로드 완료"
        );


        log(
            `Assets 다운로드 처리 완료: ${completed}개`,
            "success"
        );


    } catch (
        error
    ) {


        log(
            `Assets 처리 실패: ${error.message}`,
            "error"
        );


        setProgress(
            0,
            "Assets 처리 실패"
        );


    } finally {


        downloadAssetsButton.disabled =
            false;

    }

}
